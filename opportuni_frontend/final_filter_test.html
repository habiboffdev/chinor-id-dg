<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Final Filter Test - Opportuni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold text-gray-900 mb-8">Final Filter Test</h1>
        
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-bold mb-4">Filter Test Results</h2>
            <div id="test-results" class="space-y-4"></div>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-bold mb-4">Manual Filter Testing</h2>
            
            <!-- Search -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Search</label>
                <input type="text" id="test-search" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Search opportunities...">
            </div>

            <!-- Location -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Location</label>
                <input type="text" id="test-location" class="w-full px-3 py-2 border border-gray-300 rounded-md" placeholder="Location...">
            </div>

            <!-- Type -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Type</label>
                <select id="test-type" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="">All Types</option>
                    <option value="internship">Internship</option>
                    <option value="scholarship">Scholarship</option>
                    <option value="job">Job</option>
                </select>
            </div>

            <!-- Remote -->
            <div class="mb-4">
                <label class="flex items-center">
                    <input type="checkbox" id="test-remote" class="mr-2">
                    <span class="text-sm font-medium text-gray-700">Remote Only</span>
                </label>
            </div>

            <!-- Deadline -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Deadline</label>
                <select id="test-deadline" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="all">All Deadlines</option>
                    <option value="week">Within a week</option>
                    <option value="month">Within a month</option>
                    <option value="quarter">Within 3 months</option>
                </select>
            </div>

            <!-- Date Range -->
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Posted</label>
                <select id="test-dateRange" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="all">All Dates</option>
                    <option value="today">Today</option>
                    <option value="week">This week</option>
                    <option value="month">This month</option>
                </select>
            </div>

            <div class="flex gap-4">
                <button onclick="applyTestFilters()" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                    Apply Filters
                </button>
                <button onclick="clearTestFilters()" class="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700">
                    Clear Filters
                </button>
                <button onclick="setUndefinedFilters()" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700">
                    Test Undefined Values
                </button>
            </div>
        </div>

        <!-- Active Filters Display -->
        <div class="bg-white rounded-lg shadow-md p-6 mt-8">
            <h2 class="text-xl font-bold mb-4">Active Filters</h2>
            <div id="active-filters"></div>
        </div>

        <!-- Console Output -->
        <div class="bg-gray-900 text-green-400 rounded-lg p-6 mt-8">
            <h2 class="text-xl font-bold mb-4">Console Output</h2>
            <div id="console-output" class="font-mono text-sm max-h-64 overflow-y-auto"></div>
        </div>
    </div>

    <!-- Include the main scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/opportunities.js"></script>

    <script>
        // Override console.log to capture output
        const originalConsoleLog = console.log;
        const consoleOutput = document.getElementById('console-output');
        
        console.log = function(...args) {
            originalConsoleLog.apply(console, args);
            const message = args.map(arg => 
                typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
            ).join(' ');
            const div = document.createElement('div');
            div.textContent = `[${new Date().toISOString()}] ${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        };

        // Test functions
        function applyTestFilters() {
            console.log('🧪 Applying test filters...');
            
            currentFilters = {
                search: document.getElementById('test-search').value || undefined,
                location: document.getElementById('test-location').value || undefined,
                type: document.getElementById('test-type').value || undefined,
                isRemote: document.getElementById('test-remote').checked || undefined,
                deadline: document.getElementById('test-deadline').value || undefined,
                dateRange: document.getElementById('test-dateRange').value || undefined
            };
            
            console.log('📋 Applied filters:', currentFilters);
            updateActiveFiltersDisplay();
            runTests();
        }

        function clearTestFilters() {
            console.log('🧹 Clearing test filters...');
            currentFilters = {};
            
            // Clear form inputs
            document.getElementById('test-search').value = '';
            document.getElementById('test-location').value = '';
            document.getElementById('test-type').value = '';
            document.getElementById('test-remote').checked = false;
            document.getElementById('test-deadline').value = 'all';
            document.getElementById('test-dateRange').value = 'all';
            
            updateActiveFiltersDisplay();
            runTests();
        }

        function setUndefinedFilters() {
            console.log('⚠️ Setting undefined filters to test handling...');
            
            currentFilters = {
                search: undefined,
                location: null,
                type: '',
                isRemote: false,
                deadline: undefined,
                dateRange: 'undefined'  // String undefined to test this case
            };
            
            console.log('📋 Set problematic filters:', currentFilters);
            updateActiveFiltersDisplay();
            runTests();
        }

        function runTests() {
            const results = document.getElementById('test-results');
            results.innerHTML = '';

            // Test 1: Check for undefined filter tags in DOM
            const filterTags = document.querySelectorAll('#active-filters span');
            const undefinedTags = Array.from(filterTags).filter(tag => 
                tag.textContent.includes(': undefined') || 
                tag.textContent.includes(':undefined')
            );

            addTestResult(
                'Undefined Filter Tags Test',
                undefinedTags.length === 0,
                undefinedTags.length === 0 ? 
                    'No undefined filter tags found in DOM ✅' : 
                    `Found ${undefinedTags.length} undefined filter tags: ${undefinedTags.map(t => t.textContent).join(', ')}`
            );

            // Test 2: Check currentFilters object for undefined values
            const undefinedValues = Object.entries(currentFilters).filter(([key, value]) => 
                value === undefined || value === 'undefined'
            );

            addTestResult(
                'Current Filters Cleanup Test',
                undefinedValues.length === 0,
                undefinedValues.length === 0 ? 
                    'No undefined values in currentFilters ✅' : 
                    `Found undefined values: ${undefinedValues.map(([k, v]) => `${k}=${v}`).join(', ')}`
            );

            // Test 3: Check if cleanupFilters function exists and works
            const hasCleanupFunction = typeof window.cleanupFilters === 'function' || typeof cleanupFilters === 'function';
            addTestResult(
                'Cleanup Function Test',
                hasCleanupFunction,
                hasCleanupFunction ? 'cleanupFilters function exists ✅' : 'cleanupFilters function missing ❌'
            );

            // Test 4: Check active filters container content
            const activeFiltersContainer = document.getElementById('active-filters');
            const hasValidContent = activeFiltersContainer && !activeFiltersContainer.innerHTML.includes('undefined');
            
            addTestResult(
                'Active Filters Content Test',
                hasValidContent,
                hasValidContent ? 
                    'Active filters container has valid content ✅' : 
                    'Active filters container contains undefined content ❌'
            );
        }

        function addTestResult(testName, passed, description) {
            const results = document.getElementById('test-results');
            const div = document.createElement('div');
            div.className = `p-4 rounded-lg ${passed ? 'bg-green-100 border-green-500' : 'bg-red-100 border-red-500'} border-l-4`;
            div.innerHTML = `
                <div class="flex items-center gap-2">
                    <i class="fas ${passed ? 'fa-check text-green-600' : 'fa-times text-red-600'}"></i>
                    <strong>${testName}</strong>
                </div>
                <p class="mt-2 text-sm">${description}</p>
            `;
            results.appendChild(div);
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🧪 Final Filter Test Page Loaded');
            
            // Initialize with some test data
            currentFilters = {};
            
            // Run initial tests
            setTimeout(() => {
                runTests();
            }, 500);
        });
    </script>
</body>
</html>
