<svg viewBox="0 0 500 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Enhanced Gradients -->
    <linearGradient id="studentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="opportunityGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a21caf;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="connectionFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.8" />
      <stop offset="25%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:0.8" />
    </linearGradient>
    
    <radialGradient id="platformGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.6" />
      <stop offset="70%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#0ea5e9;stop-opacity:0" />
    </radialGradient>
    
    <!-- Drop shadow filter -->
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  
  <!-- Background with subtle pattern -->
  <rect width="500" height="350" fill="#f8fafc"/>
  
  <!-- Background glow circles -->
  <circle cx="120" cy="175" r="120" fill="url(#platformGlow)" opacity="0.4">
    <animate attributeName="r" values="120;130;120" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="175" r="120" fill="url(#platformGlow)" opacity="0.4">
    <animate attributeName="r" values="120;130;120" dur="6s" begin="3s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Students Side -->
  <g id="studentsGroup" filter="url(#dropShadow)">
    <!-- Student 1 -->
    <g transform="translate(80, 120)">
      <circle r="20" fill="url(#studentGradient)">
        <animate attributeName="r" values="20;22;20" dur="4s" repeatCount="indefinite"/>
      </circle>
      <!-- Graduation cap -->
      <g transform="translate(0, -5)">
        <rect x="-8" y="-8" width="16" height="4" rx="1" fill="#1e40af">
          <animate attributeName="y" values="-8;-10;-8" dur="4s" repeatCount="indefinite"/>
        </rect>
        <circle r="1" fill="#1e40af" cy="-6">
          <animate attributeName="cy" values="-6;-8;-6" dur="4s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Student body -->
      <rect x="-6" y="15" width="12" height="20" rx="6" fill="url(#studentGradient)" opacity="0.8"/>
      <!-- Arms -->
      <circle cx="-12" cy="20" r="3" fill="url(#studentGradient)" opacity="0.8">
        <animate attributeName="cy" values="20;18;20" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" cy="20" r="3" fill="url(#studentGradient)" opacity="0.8">
        <animate attributeName="cy" values="20;18;20" dur="4s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Student 2 -->
    <g transform="translate(80, 230)">
      <circle r="20" fill="url(#studentGradient)">
        <animate attributeName="r" values="20;22;20" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Graduation cap -->
      <g transform="translate(0, -5)">
        <rect x="-8" y="-8" width="16" height="4" rx="1" fill="#1e40af">
          <animate attributeName="y" values="-8;-10;-8" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        </rect>
        <circle r="1" fill="#1e40af" cy="-6">
          <animate attributeName="cy" values="-6;-8;-6" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Student body -->
      <rect x="-6" y="15" width="12" height="20" rx="6" fill="url(#studentGradient)" opacity="0.8"/>
      <!-- Arms -->
      <circle cx="-12" cy="20" r="3" fill="url(#studentGradient)" opacity="0.8">
        <animate attributeName="cy" values="20;18;20" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" cy="20" r="3" fill="url(#studentGradient)" opacity="0.8">
        <animate attributeName="cy" values="20;18;20" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
    </g>
    
    <!-- Student 3 -->
    <g transform="translate(140, 175)">
      <circle r="20" fill="url(#studentGradient)">
        <animate attributeName="r" values="20;22;20" dur="4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <!-- Graduation cap -->
      <g transform="translate(0, -5)">
        <rect x="-8" y="-8" width="16" height="4" rx="1" fill="#1e40af">
          <animate attributeName="y" values="-8;-10;-8" dur="4s" begin="0.7s" repeatCount="indefinite"/>
        </rect>
        <circle r="1" fill="#1e40af" cy="-6">
          <animate attributeName="cy" values="-6;-8;-6" dur="4s" begin="0.7s" repeatCount="indefinite"/>
        </circle>
      </g>
      <!-- Student body -->
      <rect x="-6" y="15" width="12" height="20" rx="6" fill="url(#studentGradient)" opacity="0.8"/>
      <!-- Arms -->
      <circle cx="-12" cy="20" r="3" fill="url(#studentGradient)" opacity="0.8">
        <animate attributeName="cy" values="20;18;20" dur="4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle cx="12" cy="20" r="3" fill="url(#studentGradient)" opacity="0.8">
        <animate attributeName="cy" values="20;18;20" dur="4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>
  
  <!-- Opportunities Side -->
  <g id="opportunitiesGroup" filter="url(#dropShadow)">
    <!-- Opportunity 1 - Trophy/Achievement -->
    <g transform="translate(420, 120)">
      <circle r="20" fill="url(#opportunityGradient)">
        <animate attributeName="r" values="20;22;20" dur="4s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <!-- Trophy -->
      <g transform="translate(0, -2)">
        <rect x="-6" y="-6" width="12" height="8" rx="2" fill="#fbbf24"/>
        <rect x="-4" y="2" width="8" height="4" fill="#f59e0b"/>
        <rect x="-2" y="6" width="4" height="6" fill="#d97706"/>
        <circle cx="-8" cy="-2" r="2" fill="#fbbf24"/>
        <circle cx="8" cy="-2" r="2" fill="#fbbf24"/>
      </g>
    </g>
    
    <!-- Opportunity 2 - Internship/Briefcase -->
    <g transform="translate(420, 230)">
      <circle r="20" fill="url(#opportunityGradient)">
        <animate attributeName="r" values="20;22;20" dur="4s" begin="3s" repeatCount="indefinite"/>
      </circle>
      <!-- Briefcase -->
      <g transform="translate(0, 0)">
        <rect x="-10" y="-4" width="20" height="12" rx="2" fill="#374151"/>
        <rect x="-8" y="-2" width="16" height="8" fill="#4b5563"/>
        <rect x="-2" y="-6" width="4" height="3" fill="#374151"/>
        <circle cx="0" cy="2" r="1" fill="#d1d5db"/>
      </g>
    </g>
    
    <!-- Opportunity 3 - Scholarship/Star -->
    <g transform="translate(360, 175)">
      <circle r="20" fill="url(#opportunityGradient)">
        <animate attributeName="r" values="20;22;20" dur="4s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <!-- Star -->
      <g transform="translate(0, 0)">
        <path d="M0,-8 L2,-2 L8,-2 L3,1 L5,7 L0,4 L-5,7 L-3,1 L-8,-2 L-2,-2 Z" fill="#fbbf24">
          <animateTransform attributeName="transform" type="rotate" values="0;10;0" dur="4s" begin="2.5s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>
  
  <!-- Central Connection Platform -->
  <g id="centralPlatform">
    <ellipse cx="250" cy="175" rx="40" ry="12" fill="url(#platformGlow)" opacity="0.6">
      <animate attributeName="rx" values="40;45;40" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.8;0.6" dur="6s" repeatCount="indefinite"/>
    </ellipse>
    
    <!-- Platform text -->
    <text x="250" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#0ea5e9" font-weight="bold" opacity="0.8">
      OPPORTUNI
    </text>
  </g>
  
  <!-- Animated Connection Paths -->
  <g id="connectionPaths">
    <!-- Path 1: Student 1 to Opportunity 1 -->
    <path d="M100 120 Q250 80 400 120" stroke="url(#connectionFlow)" stroke-width="4" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,1000;40,960;0,1000" dur="6s" begin="0s" repeatCount="indefinite"/>
    </path>
    
    <!-- Path 2: Student 2 to Opportunity 2 -->
    <path d="M100 230 Q250 270 400 230" stroke="url(#connectionFlow)" stroke-width="4" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,1000;40,960;0,1000" dur="6s" begin="2s" repeatCount="indefinite"/>
    </path>
    
    <!-- Path 3: Student 3 to Opportunity 3 -->
    <path d="M160 175 Q250 175 340 175" stroke="url(#connectionFlow)" stroke-width="4" fill="none" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="6s" begin="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dasharray" values="0,1000;40,960;0,1000" dur="6s" begin="4s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating Success Particles -->
  <g id="successParticles">
    <circle cx="200" cy="100" r="3" fill="#10b981" opacity="0">
      <animate attributeName="cy" values="100;50;100" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="300" r="3" fill="#f59e0b" opacity="0">
      <animate attributeName="cy" values="300;250;300" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="280" r="2" fill="#8b5cf6" opacity="0">
      <animate attributeName="cy" values="280;320;280" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="80" r="2" fill="#ef4444" opacity="0">
      <animate attributeName="cy" values="80;40;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Bottom Labels -->
  <g id="labels">
    <text x="120" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#studentGradient)">
      Students
    </text>
    <text x="380" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="url(#opportunityGradient)">
      Opportunities
    </text>
    
    <!-- Connecting arrow -->
    <path d="M160 310 Q250 300 340 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)" opacity="0.6"/>
    
    <!-- Arrow marker -->
    <defs>
      <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
        <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
      </marker>
    </defs>
  </g>
</svg>
