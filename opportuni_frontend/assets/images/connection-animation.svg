<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="studentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="opportunityGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a21caf;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="connectionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circles for depth -->
  <circle cx="100" cy="150" r="80" fill="#f0f9ff" opacity="0.5">
    <animate attributeName="r" values="80;85;80" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="150" r="80" fill="#fdf4ff" opacity="0.5">
    <animate attributeName="r" values="80;85;80" dur="4s" begin="2s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Left side - Students -->
  <g id="students">
    <!-- Student 1 -->
    <circle cx="80" cy="120" r="15" fill="url(#studentGrad)">
      <animate attributeName="cy" values="120;115;120" dur="3s" repeatCount="indefinite"/>
    </circle>
    <path d="M75 135 Q80 140 85 135" stroke="url(#studentGrad)" stroke-width="2" fill="none"/>
    
    <!-- Student 2 -->
    <circle cx="80" cy="180" r="15" fill="url(#studentGrad)">
      <animate attributeName="cy" values="180;175;180" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <path d="M75 195 Q80 200 85 195" stroke="url(#studentGrad)" stroke-width="2" fill="none"/>
    
    <!-- Student 3 -->
    <circle cx="120" cy="150" r="15" fill="url(#studentGrad)">
      <animate attributeName="cy" values="150;145;150" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M115 165 Q120 170 125 165" stroke="url(#studentGrad)" stroke-width="2" fill="none"/>
    
    <!-- Graduation caps on students -->
    <path d="M75 115 L85 115 L82 110 L78 110 Z" fill="#1e40af">
      <animate attributeName="d" values="M75 115 L85 115 L82 110 L78 110 Z;M75 110 L85 110 L82 105 L78 105 Z;M75 115 L85 115 L82 110 L78 110 Z" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M75 175 L85 175 L82 170 L78 170 Z" fill="#1e40af">
      <animate attributeName="d" values="M75 175 L85 175 L82 170 L78 170 Z;M75 170 L85 170 L82 165 L78 165 Z;M75 175 L85 175 L82 170 L78 170 Z" dur="3s" begin="1s" repeatCount="indefinite"/>
    </path>
    <path d="M115 145 L125 145 L122 140 L118 140 Z" fill="#1e40af">
      <animate attributeName="d" values="M115 145 L125 145 L122 140 L118 140 Z;M115 140 L125 140 L122 135 L118 135 Z;M115 145 L125 145 L122 140 L118 140 Z" dur="3s" begin="0.5s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Right side - Opportunities -->
  <g id="opportunities">
    <!-- Opportunity 1 - Trophy -->
    <circle cx="320" cy="120" r="15" fill="url(#opportunityGrad)">
      <animate attributeName="cy" values="120;115;120" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
    <path d="M315 115 L325 115 L322 108 L318 108 Z M320 108 L320 105" stroke="#a21caf" stroke-width="2" fill="none"/>
    
    <!-- Opportunity 2 - Briefcase -->
    <circle cx="320" cy="180" r="15" fill="url(#opportunityGrad)">
      <animate attributeName="cy" values="180;175;180" dur="3s" begin="2.5s" repeatCount="indefinite"/>
    </circle>
    <rect x="315" y="175" width="10" height="8" rx="1" fill="#a21caf"/>
    
    <!-- Opportunity 3 - Star -->
    <circle cx="280" cy="150" r="15" fill="url(#opportunityGrad)">
      <animate attributeName="cy" values="150;145;150" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <path d="M280 145 L282 150 L287 150 L283 153 L285 158 L280 155 L275 158 L277 153 L273 150 L278 150 Z" fill="#a21caf"/>
  </g>
  
  <!-- Connection lines with animated flow -->
  <g id="connections">
    <!-- Connection 1 -->
    <path d="M95 120 Q200 100 305 120" stroke="url(#connectionGrad)" stroke-width="3" fill="none" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,1000;20,980;0,1000" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-1000" dur="4s" repeatCount="indefinite"/>
    </path>
    
    <!-- Connection 2 -->
    <path d="M95 180 Q200 200 305 180" stroke="url(#connectionGrad)" stroke-width="3" fill="none" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,1000;20,980;0,1000" dur="4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-1000" dur="4s" begin="1s" repeatCount="indefinite"/>
    </path>
    
    <!-- Connection 3 -->
    <path d="M135 150 Q200 150 265 150" stroke="url(#connectionGrad)" stroke-width="3" fill="none" opacity="0.8">
      <animate attributeName="stroke-dasharray" values="0,1000;20,980;0,1000" dur="4s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-1000" dur="4s" begin="2s" repeatCount="indefinite"/>
    </path>
  </g>
  
  <!-- Floating particles -->
  <g id="particles">
    <circle cx="150" cy="100" r="2" fill="#0ea5e9" opacity="0.6">
      <animate attributeName="cy" values="100;80;100" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="80" r="2" fill="#d946ef" opacity="0.6">
      <animate attributeName="cy" values="80;60;80" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="170" cy="220" r="2" fill="#3b82f6" opacity="0.6">
      <animate attributeName="cy" values="220;240;220" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="230" cy="240" r="2" fill="#a21caf" opacity="0.6">
      <animate attributeName="cy" values="240;260;240" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Central connecting bridge/platform -->
  <ellipse cx="200" cy="150" rx="25" ry="8" fill="#0ea5e9" opacity="0.3">
    <animate attributeName="rx" values="25;30;25" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.5;0.3" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Text labels (optional) -->
  <text x="100" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#3b82f6" font-weight="bold">
    Students
  </text>
  <text x="300" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#d946ef" font-weight="bold">
    Opportunities
  </text>
</svg>
