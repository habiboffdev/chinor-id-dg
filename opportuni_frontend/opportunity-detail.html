<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunity Details — Opportuni</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" />
    <link href="https://fonts.cdnfonts.com/css/general-sans" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Brand theme + components -->
    <link rel="stylesheet" href="assets/css/theme.css?v=20250817-1" />
    <link rel="stylesheet" href="assets/css/components.css?v=20250817-1" />
    <link rel="stylesheet" href="assets/css/opportunity-detail.css" />
</head>
<body class="theme-opportuni">
    <!-- Student Navbar (shared component) -->
    <div id="student-navbar-root"></div>

    <div id="opportunity-cover-image" class="cover-image-container">
        <!-- Cover image will be set as background here -->
    </div>

    <main class="container">
        <div id="opportunity-detail-container">
            <!-- Loading Skeleton -->
            <div id="loading-skeleton" class="skeleton">
                <div class="skeleton-header"></div>
                <div class="skeleton-sidebar"></div>
                <div class="skeleton-content"></div>
            </div>
            <!-- Dynamic content will be injected here -->
        </div>
    </main>

    <!-- Application Modal -->
    <div id="applicationModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div>
                    <h2 id="modal-title" class="modal-title">Apply to Opportunity</h2>
                    <p id="modal-opportunity-title" class="text-muted"></p>
                </div>
                <button id="closeApplicationModal" class="btn--icon">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="applicationForm" class="modal-body">
                <div id="additional-questions-container" class="form-section">
                    <!-- Dynamic questions will be loaded here -->
                </div>
                <div class="form-section">
                    <h3 class="form-section-title">Additional Documents</h3>
                    <div class="form-group">
                        <label>Upload Documents (Optional)</label>
                        <div id="documentUploadArea" class="file-upload-area">
                            <input type="file" id="documentUpload" hidden multiple>
                            <i class="fas fa-cloud-upload-alt"></i>
                            <p>Click to upload or drag and drop</p>
                            <p class="file-upload-hint">PDF, DOCX, PNG, JPG (Max 10MB)</p>
                        </div>
                        <div id="uploaded-files-list" class="mt-3"></div>
                    </div>
                    <div class="form-group">
                        <label for="applicationNotes">Additional Notes (Optional)</label>
                        <textarea id="applicationNotes" name="notes" rows="4" class="input" placeholder="Any additional information..."></textarea>
                    </div>
                </div>
            </form>
            <div class="modal-footer">
                <button type="button" id="cancelApplication" class="btn btn-secondary">Cancel</button>
                <button type="submit" id="submitApplication" form="applicationForm" class="btn btn-primary">
                    <span id="submitButtonText">Submit Application</span>
                    <i id="submitSpinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/navbar.js"></script>
    <script src="assets/js/opportunity-detail.js"></script>
</body>
</html>
