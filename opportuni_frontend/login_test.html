<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Test - Opportuni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-lg p-8 w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Quick Login Test</h1>
            <p class="text-gray-600">Test login to access your profile</p>
        </div>
        
        <div id="loginForm">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" value="test@example.com" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input type="password" id="password" value="testpass123" 
                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <button onclick="testLogin()" 
                        class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                    <i class="fas fa-sign-in-alt mr-2"></i>Login & Go to Profile
                </button>
            </div>
        </div>
        
        <div id="status" class="mt-6 text-center text-sm text-gray-600"></div>
    </div>

    <script>
        // Simple API configuration
        const API_BASE_URL = 'http://localhost:8000/api';
        
        // Simple storage utility
        const storage = {
            set: (key, value) => localStorage.setItem(key, value),
            get: (key) => localStorage.getItem(key),
            remove: (key) => localStorage.removeItem(key)
        };
        
        async function testLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('status');
            
            statusDiv.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Logging in...';
            
            try {
                const response = await fetch(`${API_BASE_URL}/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    if (data.access) {
                        // Save tokens
                        storage.set('auth_token', data.access);
                        storage.set('refresh_token', data.refresh);
                        
                        statusDiv.innerHTML = '<i class="fas fa-check-circle text-green-600 mr-2"></i>Login successful! Redirecting...';
                        
                        // Redirect to profile page after a short delay
                        setTimeout(() => {
                            window.location.href = 'profile.html';
                        }, 1000);
                    } else {
                        statusDiv.innerHTML = '<i class="fas fa-exclamation-triangle text-red-600 mr-2"></i>Login successful but no token received';
                    }
                } else {
                    statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle text-red-600 mr-2"></i>Login failed: ${data.message || 'Unknown error'}`;
                }
            } catch (error) {
                statusDiv.innerHTML = `<i class="fas fa-exclamation-triangle text-red-600 mr-2"></i>Error: ${error.message}`;
            }
        }
        
        // Auto-focus on email field
        document.getElementById('email').focus();
        
        // Allow Enter key to submit
        document.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                testLogin();
            }
        });
    </script>
</body>
</html>
