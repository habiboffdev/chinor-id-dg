<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Test - Opportuni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-8">Button Test Page</h1>
        
        <!-- Test Buttons -->
        <div class="grid grid-cols-2 gap-4 mb-8">
            <button id="addEducationBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add Education
            </button>
            <button id="addExperienceBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add Experience
            </button>
            <button id="addSkillBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add Skill
            </button>
            <button id="addProjectBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add Project
            </button>
            <button id="addAchievementBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add Achievement
            </button>
            <button id="addLanguageBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                <i class="fas fa-plus mr-2"></i>Add Language
            </button>
        </div>
        
        <!-- Test Status -->
        <div id="status" class="mb-4 p-4 bg-white rounded shadow">
            <h3 class="font-semibold mb-2">Test Status:</h3>
            <div id="statusLog" class="text-sm text-gray-600"></div>
        </div>
        
        <!-- Toast Container -->
        <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>
        
        <!-- Modal -->
        <div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
            <div class="flex items-center justify-center min-h-screen p-4">
                <div id="modalContent" class="bg-white rounded-lg shadow-xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                    <!-- Modal content will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/components.js"></script>
    <script>
        function log(message) {
            const statusLog = document.getElementById('statusLog');
            statusLog.innerHTML += '<div>' + new Date().toLocaleTimeString() + ': ' + message + '</div>';
        }
        
        function showModal() {
            log('showModal called');
            document.getElementById('modalOverlay').classList.remove('hidden');
        }

        function hideModal() {
            log('hideModal called');
            document.getElementById('modalOverlay').classList.add('hidden');
        }
        
        function showTestModal(type) {
            log('showTestModal called for: ' + type);
            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="p-6">
                    <h3 class="text-lg font-semibold text-gray-900 mb-4">Test Modal: ${type}</h3>
                    <p class="text-gray-600 mb-4">This is a test modal for ${type}</p>
                    <div class="flex justify-end space-x-3">
                        <button onclick="hideModal()" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                            Cancel
                        </button>
                        <button class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            Test Action
                        </button>
                    </div>
                </div>
            `;
            showModal();
        }
        
        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', function() {
            log('DOM loaded, initializing test...');
            
            // Test button click handlers
            const buttons = [
                { id: 'addEducationBtn', type: 'Education' },
                { id: 'addExperienceBtn', type: 'Experience' },
                { id: 'addSkillBtn', type: 'Skill' },
                { id: 'addProjectBtn', type: 'Project' },
                { id: 'addAchievementBtn', type: 'Achievement' },
                { id: 'addLanguageBtn', type: 'Language' }
            ];
            
            buttons.forEach(({ id, type }) => {
                const button = document.getElementById(id);
                if (button) {
                    button.addEventListener('click', () => {
                        log(`${type} button clicked`);
                        showTestModal(type);
                    });
                    log(`Event listener added for ${id}`);
                } else {
                    log(`ERROR: Button ${id} not found`);
                }
            });
            
            // Test modal overlay click
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === document.getElementById('modalOverlay')) {
                    hideModal();
                }
            });
            
            log('Initialization complete');
        });
    </script>
</body>
</html>
