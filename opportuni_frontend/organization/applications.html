<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Applications - Opportuni</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/theme.css">
    <link rel="stylesheet" href="../assets/css/org.css">
    <link rel="stylesheet" href="../assets/css/layout-shim.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="theme-opportuni min-h-screen">
    <!-- Universal Org Navbar mount point -->
    <div id="org-navbar"></div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Applications</h1>
                    <p class="text-gray-600">Manage applications for your opportunities</p>
                </div>
                <div class="flex space-x-3">
                    <button id="exportBtn" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                        <i class="fas fa-download mr-2"></i>Export
                    </button>
                    <button id="bulkActionsBtn" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                        <i class="fas fa-tasks mr-2"></i>Bulk Actions
                    </button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-4">
                <div>
                    <input type="text" id="searchInput" placeholder="Search applications..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <select id="statusFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Status</option>
                        <option value="pending">Pending</option>
                        <option value="reviewing">Under Review</option>
                        <option value="shortlisted">Shortlisted</option>
                        <option value="accepted">Accepted</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div>
                    <select id="opportunityFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Opportunities</option>
                        <!-- Will be populated dynamically -->
                    </select>
                </div>
                <div>
                    <input type="date" id="dateFromFilter" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <input type="date" id="dateToFilter" 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Total Applications</p>
                        <p id="totalApplications" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-file-alt text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Pending</p>
                        <p id="pendingApplications" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-clock text-yellow-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Under Review</p>
                        <p id="reviewingApplications" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-search text-orange-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Accepted</p>
                        <p id="acceptedApplications" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-check text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">This Week</p>
                        <p id="weeklyApplications" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-calendar-week text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Applications Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <h3 class="text-lg font-semibold text-gray-900">Applications</h3>
                <div class="flex items-center space-x-2">
                    <input type="checkbox" id="selectAll" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                    <label for="selectAll" class="text-sm text-gray-600">Select All</label>
                </div>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                <input type="checkbox" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            </th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Opportunity</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Applied</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="applicationsTable" class="bg-white divide-y divide-gray-200">
                        <!-- Applications will be loaded here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div id="pagination" class="px-6 py-4 border-t border-gray-200">
                <!-- Pagination will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Application Detail Modal -->
    <div id="applicationModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-4xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">Application Details</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="applicationModalContent" class="p-6">
                <!-- Application details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Status Update Modal -->
    <div id="statusModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">Update Status</h3>
                <button id="closeStatusModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="statusForm" class="p-6">
                <input type="hidden" id="applicationId">
                <div class="mb-4">
                    <label for="newStatus" class="block text-sm font-medium text-gray-700 mb-2">New Status</label>
                    <select id="newStatus" required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="pending">Pending</option>
                        <option value="reviewing">Under Review</option>
                        <option value="shortlisted">Shortlisted</option>
                        <option value="accepted">Accepted</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="mb-6">
                    <label for="statusNote" class="block text-sm font-medium text-gray-700 mb-2">Note (Optional)</label>
                    <textarea id="statusNote" rows="3" placeholder="Add a note about this status change..." 
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelStatusBtn" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors duration-200">
                        Update Status
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
            <span class="text-gray-700">Loading...</span>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/org-navbar.js"></script>
    <script>document.addEventListener('DOMContentLoaded',()=>{ try{ window.OrgNavbar?.mount?.(); }catch(e){} });</script>
    <script>
        // Applications Page Logic
        let currentPage = 1;
        let selectedApplications = new Set();
        
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize auth and check user type
            if (!auth.isAuthenticated() || auth.getUserType() !== 'organization') {
                window.location.href = '../index.html';
                return;
            }

            // Initialize UI
            auth.updateUI();
            await loadStats();
            await loadOpportunities();
            await loadApplications();
            
            // Event listeners
            document.getElementById('searchInput').addEventListener('input', debounce(handleFilter, 300));
            document.getElementById('statusFilter').addEventListener('change', handleFilter);
            document.getElementById('opportunityFilter').addEventListener('change', handleFilter);
            document.getElementById('dateFromFilter').addEventListener('change', handleFilter);
            document.getElementById('dateToFilter').addEventListener('change', handleFilter);
            document.getElementById('selectAll').addEventListener('change', handleSelectAll);
            document.getElementById('exportBtn').addEventListener('click', handleExport);
            document.getElementById('bulkActionsBtn').addEventListener('click', handleBulkActions);
            document.getElementById('closeModalBtn').addEventListener('click', hideApplicationModal);
            document.getElementById('closeStatusModalBtn').addEventListener('click', hideStatusModal);
            document.getElementById('cancelStatusBtn').addEventListener('click', hideStatusModal);
            document.getElementById('statusForm').addEventListener('submit', handleUpdateStatus);
        });

        async function loadStats() {
            try {
                const stats = await api.organizations.getApplicationStats();
                // Backend keys mapping
                document.getElementById('totalApplications').textContent = stats.total_applications ?? 0;
                document.getElementById('pendingApplications').textContent = stats.pending_applications ?? 0;
                document.getElementById('reviewingApplications').textContent = stats.under_review_applications ?? 0;
                document.getElementById('acceptedApplications').textContent = stats.accepted_applications ?? 0;
                // Weekly metric not provided; compute from list after load if needed
                document.getElementById('weeklyApplications').textContent = '—';
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

    async function loadOpportunities() {
            try {
        const response = await api.organizations.getOpportunities();
        const opportunities = response.results || response;
                
                const select = document.getElementById('opportunityFilter');
                select.innerHTML = '<option value="">All Opportunities</option>';
                
                opportunities.forEach(opp => {
                    const option = document.createElement('option');
                    option.value = opp.id;
                    option.textContent = opp.title;
                    select.appendChild(option);
                });
            } catch (error) {
                console.error('Error loading opportunities:', error);
            }
        }

        async function loadApplications(page = 1) {
            try {
                showLoading();
                const filters = {
                    page,
                    search: document.getElementById('searchInput').value,
                    status: document.getElementById('statusFilter').value,
                    opportunity: document.getElementById('opportunityFilter').value,
                    date_from: document.getElementById('dateFromFilter').value,
                    date_to: document.getElementById('dateToFilter').value
                };
                
                const data = await api.organizations.getApplications(filters);
                
                renderApplicationsTable(data.results);
                renderPagination(data, page);
                currentPage = page;
                
                hideLoading();
            } catch (error) {
                console.error('Error loading applications:', error);
                showToast('Failed to load applications', 'error');
                hideLoading();
            }
        }

        function renderApplicationsTable(applications) {
            const tbody = document.getElementById('applicationsTable');
            
            if (applications.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                            <i class="fas fa-file-alt text-4xl mb-4"></i>
                            <p class="text-lg">No applications found</p>
                            <p class="text-sm">Applications will appear here when students apply to your opportunities</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = applications.map(app => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <input type="checkbox" class="application-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500" value="${app.id}">
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white font-medium">
                                ${(app.student.first_name?.[0] || '') + (app.student.last_name?.[0] || '')}
                            </div>
                            <div class="ml-3">
                                <p class="text-sm font-medium text-gray-900">${app.student.first_name} ${app.student.last_name}</p>
                                <p class="text-sm text-gray-500">${app.student.email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4">
                        <p class="text-sm font-medium text-gray-900">${app.opportunity.title}</p>
                        <p class="text-sm text-gray-500">${app.opportunity.type}</p>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${formatDate(app.created_at)}</td>
                    <td class="px-6 py-4">
                        ${getStatusBadge(app.status)}
                    </td>
                    <td class="px-6 py-4 text-sm font-medium">
                        <div class="flex space-x-2">
                            <button onclick="viewApplication(${app.id})" class="text-blue-600 hover:text-blue-900" title="View Details">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="updateStatus(${app.id}, '${app.status}')" class="text-purple-600 hover:text-purple-900" title="Update Status">
                                <i class="fas fa-edit"></i>
                            </button>
                            <button onclick="downloadResume('${app.resume || ''}')" class="text-green-600 hover:text-green-900" title="Download Resume" ${!app.resume ? 'disabled' : ''}>
                                <i class="fas fa-download"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
            
            // Add event listeners to checkboxes
            document.querySelectorAll('.application-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', handleApplicationSelect);
            });
        }

        function getStatusBadge(status) {
            const badges = {
                pending: '<span class="px-2 py-1 text-xs bg-yellow-100 text-yellow-800 rounded-full">Pending</span>',
                reviewing: '<span class="px-2 py-1 text-xs bg-orange-100 text-orange-800 rounded-full">Under Review</span>',
                shortlisted: '<span class="px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded-full">Shortlisted</span>',
                accepted: '<span class="px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full">Accepted</span>',
                rejected: '<span class="px-2 py-1 text-xs bg-red-100 text-red-800 rounded-full">Rejected</span>'
            };
            return badges[status] || '<span class="px-2 py-1 text-xs bg-gray-100 text-gray-800 rounded-full">Unknown</span>';
        }

        function renderPagination(data, currentPage) {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(data.count / 20);
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let pagination = '<div class="flex items-center justify-between">';
            pagination += `<p class="text-sm text-gray-700">Showing ${((currentPage - 1) * 20) + 1} to ${Math.min(currentPage * 20, data.count)} of ${data.count} results</p>`;
            pagination += '<div class="flex space-x-2">';
            
            if (currentPage > 1) {
                pagination += `<button onclick="loadApplications(${currentPage - 1})" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Previous</button>`;
            }
            
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                const isActive = i === currentPage;
                pagination += `<button onclick="loadApplications(${i})" class="px-3 py-1 border ${isActive ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-300 hover:bg-gray-50'} rounded text-sm">${i}</button>`;
            }
            
            if (currentPage < totalPages) {
                pagination += `<button onclick="loadApplications(${currentPage + 1})" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Next</button>`;
            }
            
            pagination += '</div></div>';
            container.innerHTML = pagination;
        }

        async function viewApplication(applicationId) {
            try {
                showLoading();
                const app = await api.applications.getDetails(applicationId);
                
                const modalContent = document.getElementById('applicationModalContent');
                modalContent.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                        <!-- Student Information -->
                        <div>
                            <h4 class="text-lg font-semibold text-gray-900 mb-4">Student Information</h4>
                            <div class="bg-gray-50 rounded-lg p-4 space-y-3">
                                <div class="flex items-center space-x-3">
                                    <div class="w-12 h-12 bg-blue-600 rounded-full flex items-center justify-center text-white font-bold">
                                        ${(app.student.first_name?.[0] || '') + (app.student.last_name?.[0] || '')}
                                    </div>
                                    <div>
                                        <p class="font-medium text-gray-900">${app.student.first_name} ${app.student.last_name}</p>
                                        <p class="text-sm text-gray-600">${app.student.email}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 gap-4 text-sm">
                                    <div>
                                        <p class="text-gray-600">University:</p>
                                        <p class="font-medium">${app.student.university || 'Not specified'}</p>
                                    </div>
                                    <div>
                                        <p class="text-gray-600">Major:</p>
                                        <p class="font-medium">${app.student.major || 'Not specified'}</p>
                                    </div>
                                    <div>
                                        <p class="text-gray-600">Year:</p>
                                        <p class="font-medium">${app.student.year || 'Not specified'}</p>
                                    </div>
                                    <div>
                                        <p class="text-gray-600">GPA:</p>
                                        <p class="font-medium">${app.student.gpa || 'Not provided'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Application Details -->
                        <div>
                            <h4 class="text-lg font-semibold text-gray-900 mb-4">Application Details</h4>
                            <div class="space-y-4">
                                <div>
                                    <p class="text-sm text-gray-600">Opportunity:</p>
                                    <p class="font-medium">${app.opportunity.title}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Applied on:</p>
                                    <p class="font-medium">${formatDate(app.created_at)}</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-600">Status:</p>
                                    ${getStatusBadge(app.status)}
                                </div>
                                ${app.cover_letter ? `
                                <div>
                                    <p class="text-sm text-gray-600 mb-2">Cover Letter:</p>
                                    <div class="bg-gray-50 rounded-lg p-3 text-sm">${app.cover_letter}</div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>
                    
                    <!-- Status History -->
                    ${app.status_history && app.status_history.length > 0 ? `
                    <div class="mt-8">
                        <h4 class="text-lg font-semibold text-gray-900 mb-4">Status History</h4>
                        <div class="space-y-3">
                            ${app.status_history.map(history => `
                                <div class="flex items-center space-x-3 p-3 bg-gray-50 rounded-lg">
                                    <div class="flex-shrink-0">
                                        ${getStatusBadge(history.status)}
                                    </div>
                                    <div class="flex-1">
                                        <p class="text-sm text-gray-900">${history.note || 'Status updated'}</p>
                                        <p class="text-xs text-gray-500">${formatDate(history.created_at)}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    ` : ''}
                    
                    <!-- Actions -->
                    <div class="flex justify-end space-x-3 pt-6 border-t border-gray-200 mt-8">
                        <button onclick="updateStatus(${app.id}, '${app.status}')" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors">
                            <i class="fas fa-edit mr-2"></i>Update Status
                        </button>
                        <button onclick="downloadResume('${app.resume || ''}')" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors" ${!app.resume ? 'disabled' : ''}>
                            <i class="fas fa-download mr-2"></i>Download Resume
                        </button>
                        <button onclick="window.location.href='communications.html?student=${app.student.id}'" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                            <i class="fas fa-envelope mr-2"></i>Message Student
                        </button>
                    </div>
                `;
                
                hideLoading();
                showApplicationModal();
            } catch (error) {
                console.error('Error loading application:', error);
                showToast('Failed to load application details', 'error');
                hideLoading();
            }
        }

        function updateStatus(applicationId, currentStatus) {
            document.getElementById('applicationId').value = applicationId;
            document.getElementById('newStatus').value = currentStatus;
            showStatusModal();
        }

    async function handleUpdateStatus(e) {
            e.preventDefault();
            
            const applicationId = document.getElementById('applicationId').value;
            const newStatus = document.getElementById('newStatus').value;
            const note = document.getElementById('statusNote').value;
            
            try {
                showLoading();
        await api.applications.updateStatus(applicationId, { status: newStatus, reason: note });
                hideLoading();
                hideStatusModal();
                showToast('Application status updated successfully', 'success');
                await loadApplications(currentPage);
                await loadStats();
            } catch (error) {
                console.error('Error updating status:', error);
                hideLoading();
                showToast('Failed to update application status', 'error');
            }
        }

        function downloadResume(resumeUrl) {
            if (!resumeUrl) {
                showToast('No resume available', 'error');
                return;
            }
            window.open(resumeUrl, '_blank');
        }

        function handleFilter() {
            currentPage = 1;
            loadApplications(1);
        }

        function handleSelectAll(e) {
            const checkboxes = document.querySelectorAll('.application-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = e.target.checked;
                handleApplicationSelect({ target: checkbox });
            });
        }

        function handleApplicationSelect(e) {
            const applicationId = e.target.value;
            if (e.target.checked) {
                selectedApplications.add(applicationId);
            } else {
                selectedApplications.delete(applicationId);
            }
            
            // Update bulk actions button
            const bulkBtn = document.getElementById('bulkActionsBtn');
            if (selectedApplications.size > 0) {
                bulkBtn.textContent = `Bulk Actions (${selectedApplications.size})`;
            } else {
                bulkBtn.innerHTML = '<i class="fas fa-tasks mr-2"></i>Bulk Actions';
            }
        }

        function handleBulkActions() {
            if (selectedApplications.size === 0) {
                showToast('Please select applications first', 'error');
                return;
            }
            
            // Simple implementation - could be expanded with a modal
            const action = prompt('Enter action (accept/reject/review):', 'review');
            if (action && ['accept', 'reject', 'review'].includes(action)) {
                bulkUpdateStatus(action);
            }
        }

    async function bulkUpdateStatus(status) {
            try {
                showLoading();
                const applicationIds = Array.from(selectedApplications);
        await api.applications.bulkUpdateStatus(applicationIds.map(Number), status);
                
                hideLoading();
                showToast(`${applicationIds.length} applications updated successfully`, 'success');
                selectedApplications.clear();
                await loadApplications(currentPage);
                await loadStats();
                
                // Reset bulk actions button
                document.getElementById('bulkActionsBtn').innerHTML = '<i class="fas fa-tasks mr-2"></i>Bulk Actions';
                document.getElementById('selectAll').checked = false;
            } catch (error) {
                console.error('Error bulk updating:', error);
                hideLoading();
                showToast('Failed to update applications', 'error');
            }
        }

        async function handleExport() {
            try {
                showLoading();
                // Export currently loaded page to CSV as a quick win
                const rows = document.querySelectorAll('#applicationsTable tr');
                const csv = [];
                csv.push(['Student', 'Email', 'Opportunity', 'Type', 'Applied', 'Status']);
                rows.forEach(tr => {
                    const tds = tr.querySelectorAll('td');
                    if (tds.length >= 6) {
                        const student = tds[1].innerText.replace(/\n+/g,' ').trim();
                        const opportunity = tds[2].innerText.replace(/\n+/g,' ').trim();
                        const applied = tds[3].innerText.trim();
                        const status = tds[4].innerText.trim();
                        csv.push([student, '', opportunity, '', applied, status]);
                    }
                });
                const content = csv.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `applications_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                URL.revokeObjectURL(url);
                hideLoading();
                showToast('Exported current page as CSV', 'success');
            } catch (error) {
                console.error('Error exporting data:', error);
                hideLoading();
                showToast('Failed to export data', 'error');
            }
        }

        function showApplicationModal() {
            document.getElementById('applicationModal').classList.remove('hidden');
        }

        function hideApplicationModal() {
            document.getElementById('applicationModal').classList.add('hidden');
        }

        function showStatusModal() {
            document.getElementById('statusModal').classList.remove('hidden');
        }

        function hideStatusModal() {
            document.getElementById('statusModal').classList.add('hidden');
            document.getElementById('statusForm').reset();
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // Utility functions
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            return new Date(dateString).toLocaleDateString();
        }
    </script>
</body>
</html>
