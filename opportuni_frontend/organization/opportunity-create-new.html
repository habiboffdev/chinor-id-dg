<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Opportunity · Opportuni</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/org.css">
  <link rel="stylesheet" href="../assets/css/wizard-create.css">
</head>
<body class="theme-opportuni">
  <div id="org-navbar"></div>

  <main class="wizard-container">
    <header class="wizard-header">
      <a href="/organization/dashboard.html" class="btn" aria-label="Back to dashboard">
        <i class="fa fa-arrow-left"></i>Back
      </a>
      <div class="spacer"></div>
      <button id="saveDraft" class="btn">
        <i class="fa fa-save"></i>Save Draft
      </button>
    </header>

    <div class="wizard-card">
      <div class="wizard-progress">
        <div class="progress-info">
          <span id="stepCounter">1</span> of <span id="totalSteps">8</span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>

      <div class="wizard-content">
        <h1 id="stepTitle" class="wizard-title">What should we call this opportunity?</h1>
        <p id="stepHint" class="wizard-hint">Keep it clear and specific. Students search by job titles like "Software Engineering Intern".</p>

        <div class="wizard-body">
          <!-- Step content will be dynamically inserted here -->
          <div id="stepContent"></div>
        </div>

        <div class="wizard-actions">
          <button id="prevBtn" class="btn" disabled>
            <i class="fa fa-arrow-left"></i>Previous
          </button>
          <div class="spacer"></div>
          <button id="nextBtn" class="btn btn-primary">
            Next<i class="fa fa-arrow-right"></i>
          </button>
          <button id="publishBtn" class="btn btn-primary" style="display: none;">
            <i class="fa fa-rocket"></i>Publish
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Hidden form to collect all data -->
  <form id="opportunityForm" style="display: none;">
    <input name="title" type="text">
    <textarea name="description"></textarea>
    <input name="opportunity_type" type="text">
    <input name="location" type="text">
    <input name="is_remote" type="checkbox">
    <input name="start_date" type="date">
    <input name="application_deadline" type="datetime-local">
    <input name="min_gpa" type="number">
    <input name="required_major" type="text">
    <input name="graduation_year_min" type="number">
    <input name="graduation_year_max" type="number">
    <input name="compensation" type="text">
    <input name="max_applications" type="number">
    <textarea name="benefits"></textarea>
  </form>

  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/components.js"></script>
  <script src="../assets/js/org-navbar.js"></script>
  <script src="../assets/js/wizard-create.js"></script>
</body>
</html>
