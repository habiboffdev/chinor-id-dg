<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Opportunity - Opportuni</title>
  
  <!-- Fonts (load first for FOUT prevention) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/org.css">
  <link rel="stylesheet" href="../assets/css/wizard-create.css">
</head>
<body class="theme-opportuni">

  <!-- Universal Org Navbar mount point -->
  <div id="org-navbar"></div>

  <!-- Main Container -->
  <main class="org__main">
    <div class="wizard-container">
      <!-- Header -->
      <div class="wizard-header">
        <a href="opportunities.html" class="btn btn--ghost">
          <i class="fas fa-arrow-left"></i>
          Back to Opportunities
        </a>
        <div class="spacer"></div>
        <button type="button" class="btn btn--ghost" onclick="wizardApp.saveDraft()">
          <i class="fas fa-save"></i>
          Save Draft
        </button>
      </div>

      <!-- Wizard Card -->
      <div class="wizard-card">
        <!-- Progress -->
        <div class="wizard-progress">
          <div class="progress-info">
            <span id="progress-text">Step 1 of 8</span>
            <span id="progress-status">Basic Information</span>
          </div>
          <div class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
        </div>

        <!-- Title & Hint -->
        <h1 id="wizard-title" class="wizard-title">Tell us about your opportunity</h1>
        <p id="wizard-hint" class="wizard-hint">Let's start with the basics - what kind of opportunity are you offering?</p>

        <!-- Dynamic Content Area -->
        <div id="wizard-content" class="wizard-body">
          <!-- Content injected by JS -->
        </div>

        <!-- Actions -->
        <div class="wizard-actions">
          <button type="button" id="btn-prev" class="btn btn--ghost" onclick="wizardApp.prevStep()" disabled>
            <i class="fas fa-chevron-left"></i>
            Previous
          </button>
          <div class="spacer"></div>
          <button type="button" id="btn-next" class="btn btn--primary" onclick="wizardApp.nextStep()">
            Next
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Hidden Form for Data Collection -->
  <form id="opportunity-form" style="display: none;">
    <!-- Basic Info -->
    <input type="text" name="title" id="form_title">
    <textarea name="description" id="form_description"></textarea>
    <select name="type" id="form_type">
      <option value="">Select type...</option>
      <option value="internship">Internship</option>
      <option value="job">Job</option>
      <option value="scholarship">Scholarship</option>
      <option value="competition">Competition</option>
      <option value="volunteer">Volunteer</option>
      <option value="event">Event</option>
    </select>

    <!-- Dates -->
    <input type="datetime-local" name="application_deadline" id="form_application_deadline">
    <input type="datetime-local" name="start_date" id="form_start_date">
    <input type="datetime-local" name="end_date" id="form_end_date">

    <!-- Details -->
    <input type="text" name="location" id="form_location">
    <select name="location_type" id="form_location_type">
      <option value="on_site">On-site</option>
      <option value="remote">Remote</option>
      <option value="hybrid">Hybrid</option>
    </select>
    <input type="number" name="compensation_amount" id="form_compensation_amount">
    <select name="compensation_type" id="form_compensation_type">
      <option value="">Select type...</option>
      <option value="stipend">Stipend</option>
      <option value="salary">Salary</option>
      <option value="hourly">Hourly</option>
      <option value="scholarship">Scholarship</option>
      <option value="unpaid">Unpaid</option>
    </select>

    <!-- Eligibility -->
    <input type="number" name="min_gpa" id="form_min_gpa" step="0.1" min="0" max="4">
    <input type="text" name="required_major" id="form_required_major">
    <input type="text" name="min_year" id="form_min_year">
    <input type="text" name="max_year" id="form_max_year">
    <input type="number" name="age_min" id="form_age_min" min="16" max="100">
    <input type="number" name="age_max" id="form_age_max" min="16" max="100">

    <!-- Advanced -->
    <input type="number" name="max_applications" id="form_max_applications">
    <input type="checkbox" name="featured" id="form_featured">
    <input type="checkbox" name="urgent" id="form_urgent">
    <textarea name="application_instructions" id="form_application_instructions"></textarea>
    <input type="file" name="cover_image" id="form_cover_image" accept="image/*">
  </form>

  <!-- Scripts -->
  <script>
    // API Configuration
    if (!window.API_BASE_URL) {
      try {
        const origin = window.location.origin;
        window.API_BASE_URL = origin.replace(':8080', ':8000') + '/api';
      } catch (e) { 
        window.API_BASE_URL = '/api'; 
      }
    }
  </script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/org-navbar.js"></script>
  <script src="../assets/js/wizard-create.js"></script>
  
  <!-- Mount navbar -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      try { 
        window.OrgNavbar?.mount?.(); 
      } catch(e) {
        console.error('Failed to mount navbar:', e);
      }
    });
  </script>

</body>
</html>
