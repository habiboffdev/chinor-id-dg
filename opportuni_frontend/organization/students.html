<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students - Opportuni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50">
    <!-- Navigation -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <a href="dashboard.html" class="flex items-center space-x-2">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background: var(--brand-primary);">
                            <i class="fas fa-graduation-cap text-white text-sm"></i>
                        </div>
                        <span class="text-xl font-bold" style="color: var(--accent-2);">Opportuni</span>
                    </a>
                </div>
                
                <div class="flex items-center space-x-4">
                    <button id="notificationBtn" class="relative p-2 text-gray-600 hover:text-blue-600 transition-colors">
                        <i class="fas fa-bell text-lg"></i>
                        <span id="notificationBadge" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center hidden">0</span>
                    </button>
                    
                    <div class="relative">
                        <button id="userMenuBtn" class="flex items-center space-x-2 p-2 rounded-lg hover:bg-gray-100 transition-colors">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background: var(--brand-primary);">
                                <i class="fas fa-building text-white text-sm"></i>
                            </div>
                            <span id="orgName" class="text-gray-700 font-medium">Organization</span>
                            <i class="fas fa-chevron-down text-gray-400 text-sm"></i>
                        </button>
                        <div id="userMenu" class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-gray-200 hidden z-10">
                            <a href="profile.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 border-b border-gray-100">
                                <i class="fas fa-user mr-2"></i>Profile
                            </a>
                            <a href="students.html" class="block px-4 py-2 text-blue-600 bg-blue-50 border-b border-gray-100">
                                <i class="fas fa-users mr-2"></i>Students
                            </a>
                            <a href="applications.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 border-b border-gray-100">
                                <i class="fas fa-file-alt mr-2"></i>Applications
                            </a>
                            <a href="communications.html" class="block px-4 py-2 text-gray-700 hover:bg-gray-50 border-b border-gray-100">
                                <i class="fas fa-comments mr-2"></i>Communications
                            </a>
                            <button id="logoutBtn" class="w-full text-left px-4 py-2 text-red-600 hover:bg-red-50">
                                <i class="fas fa-sign-out-alt mr-2"></i>Logout
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-8">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-3xl font-bold text-gray-900 mb-2">Students</h1>
                    <p class="text-gray-600">Browse and manage students in your network</p>
                </div>
                <div class="flex space-x-3">
                    <button id="exportBtn" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg hover:bg-gray-200 transition-colors">
                        <i class="fas fa-download mr-2"></i>Export
                    </button>
                    <button id="inviteBtn" class="px-4 py-2 text-white rounded-lg transition-colors duration-200 hover:opacity-90" style="background: var(--brand-primary);">
                        <i class="fas fa-user-plus mr-2"></i>Invite Students
                    </button>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div>
                    <input type="text" id="searchInput" placeholder="Search students..." 
                           class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <select id="majorFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Majors</option>
                        <option value="computer_science">Computer Science</option>
                        <option value="engineering">Engineering</option>
                        <option value="business">Business</option>
                        <option value="biology">Biology</option>
                        <option value="psychology">Psychology</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div>
                    <select id="yearFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Years</option>
                        <option value="freshman">Freshman</option>
                        <option value="sophomore">Sophomore</option>
                        <option value="junior">Junior</option>
                        <option value="senior">Senior</option>
                        <option value="graduate">Graduate</option>
                    </select>
                </div>
                <div>
                    <select id="statusFilter" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="applied">Has Applied</option>
                        <option value="hired">Hired</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Total Students</p>
                        <p id="totalStudents" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-users text-blue-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Active Applicants</p>
                        <p id="activeApplicants" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-file-alt text-green-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">Hired Students</p>
                        <p id="hiredStudents" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-handshake text-purple-600 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-gray-600 text-sm">New This Week</p>
                        <p id="newThisWeek" class="text-2xl font-bold text-gray-900">-</p>
                    </div>
                    <div class="w-12 h-12 bg-orange-100 rounded-lg flex items-center justify-center">
                        <i class="fas fa-user-plus text-orange-600 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- Students Table -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="px-6 py-4 border-b border-gray-200">
                <h3 class="text-lg font-semibold text-gray-900">Students Directory</h3>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Student</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Major</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Year</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">University</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="studentsTable" class="bg-white divide-y divide-gray-200">
                        <!-- Students will be loaded here -->
                    </tbody>
                </table>
            </div>
            
            <!-- Pagination -->
            <div id="pagination" class="px-6 py-4 border-t border-gray-200">
                <!-- Pagination will be loaded here -->
            </div>
        </div>
    </main>

    <!-- Student Detail Modal -->
    <div id="studentModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-2xl w-full mx-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">Student Profile</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <div id="studentModalContent" class="p-6">
                <!-- Student details will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Invite Modal -->
    <div id="inviteModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-xl shadow-xl max-w-md w-full mx-4">
            <div class="flex justify-between items-center p-6 border-b border-gray-200">
                <h3 class="text-xl font-semibold text-gray-900">Invite Students</h3>
                <button id="closeInviteModalBtn" class="text-gray-400 hover:text-gray-600">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>
            <form id="inviteForm" class="p-6">
                <div class="mb-4">
                    <label for="inviteEmails" class="block text-sm font-medium text-gray-700 mb-2">Email Addresses</label>
                    <textarea id="inviteEmails" rows="4" placeholder="Enter email addresses, one per line..." 
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div class="mb-6">
                    <label for="inviteMessage" class="block text-sm font-medium text-gray-700 mb-2">Message (Optional)</label>
                    <textarea id="inviteMessage" rows="3" placeholder="Personal message to include..." 
                              class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" id="cancelInviteBtn" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" class="px-4 py-2 text-white rounded-lg transition-colors duration-200 hover:opacity-90" style="background: var(--brand-primary);">
                        Send Invites
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white rounded-lg p-6 flex items-center space-x-3">
            <div class="animate-spin rounded-full h-6 w-6 border-b-2 border-blue-600"></div>
            <span class="text-gray-700">Loading...</span>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 space-y-2"></div>

    <script src="../assets/js/utils.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script src="../assets/js/components.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        // Students Page Logic
        let currentPage = 1;
        let currentFilters = {};
        
        document.addEventListener('DOMContentLoaded', async function() {
            // Initialize auth and check user type
            if (!auth.isAuthenticated() || auth.getUserType() !== 'organization') {
                window.location.href = '../index.html';
                return;
            }

            // Initialize UI
            auth.updateUI();
            await loadStats();
            await loadStudents();
            
            // Event listeners
            document.getElementById('searchInput').addEventListener('input', debounce(handleFilter, 300));
            document.getElementById('majorFilter').addEventListener('change', handleFilter);
            document.getElementById('yearFilter').addEventListener('change', handleFilter);
            document.getElementById('statusFilter').addEventListener('change', handleFilter);
            document.getElementById('exportBtn').addEventListener('click', handleExport);
            document.getElementById('inviteBtn').addEventListener('click', showInviteModal);
            document.getElementById('closeModalBtn').addEventListener('click', hideStudentModal);
            document.getElementById('closeInviteModalBtn').addEventListener('click', hideInviteModal);
            document.getElementById('cancelInviteBtn').addEventListener('click', hideInviteModal);
            document.getElementById('inviteForm').addEventListener('submit', handleSendInvites);
        });

        async function loadStats() {
            try {
                const response = await api.organizations.getStudentStats();
                const stats = response.data;
                
                document.getElementById('totalStudents').textContent = stats.total_students || 0;
                document.getElementById('activeApplicants').textContent = stats.active_applicants || 0;
                document.getElementById('hiredStudents').textContent = stats.hired_students || 0;
                document.getElementById('newThisWeek').textContent = stats.new_this_week || 0;
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadStudents(page = 1) {
            try {
                showLoading();
                const filters = {
                    page,
                    search: document.getElementById('searchInput').value,
                    major: document.getElementById('majorFilter').value,
                    year: document.getElementById('yearFilter').value,
                    status: document.getElementById('statusFilter').value
                };
                
                const response = await api.organizations.getStudents(filters);
                const data = response.data;
                
                renderStudentsTable(data.results);
                renderPagination(data, page);
                currentPage = page;
                
                hideLoading();
            } catch (error) {
                console.error('Error loading students:', error);
                showToast('Failed to load students', 'error');
                hideLoading();
            }
        }

        function renderStudentsTable(students) {
            const tbody = document.getElementById('studentsTable');
            
            if (students.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                            <i class="fas fa-users text-4xl mb-4"></i>
                            <p class="text-lg">No students found</p>
                            <p class="text-sm">Try adjusting your filters or invite new students</p>
                        </td>
                    </tr>
                `;
                return;
            }
            
            tbody.innerHTML = students.map(student => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4">
                        <div class="flex items-center">
                            <div class="w-10 h-10 rounded-full flex items-center justify-center text-white font-medium" style="background: var(--brand-primary);">
                                ${(student.first_name?.[0] || '') + (student.last_name?.[0] || '')}
                            </div>
                            <div class="ml-3">
                                <p class="text-sm font-medium text-gray-900">${student.first_name} ${student.last_name}</p>
                                <p class="text-sm text-gray-500">${student.email}</p>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-900">${student.major || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${student.year || '-'}</td>
                    <td class="px-6 py-4 text-sm text-gray-900">${student.university || '-'}</td>
                    <td class="px-6 py-4">
                        ${getStatusBadge(student.status)}
                    </td>
                    <td class="px-6 py-4 text-sm font-medium">
                        <div class="flex space-x-2">
                            <button onclick="viewStudent(${student.id})" class="text-blue-600 hover:text-blue-900">
                                <i class="fas fa-eye"></i>
                            </button>
                            <button onclick="messageStudent(${student.id})" class="text-green-600 hover:text-green-900">
                                <i class="fas fa-envelope"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function getStatusBadge(status) {
            const badges = {
                active: '<span class="px-2 py-1 text-xs bg-green-100 text-green-800 rounded-full">Active</span>',
                applied: '<span class="px-2 py-1 text-xs bg-blue-100 text-blue-800 rounded-full">Applied</span>',
                hired: '<span class="px-2 py-1 text-xs bg-purple-100 text-purple-800 rounded-full">Hired</span>',
                default: '<span class="px-2 py-1 text-xs bg-gray-100 text-gray-800 rounded-full">Unknown</span>'
            };
            return badges[status] || badges.default;
        }

        function renderPagination(data, currentPage) {
            const container = document.getElementById('pagination');
            const totalPages = Math.ceil(data.count / 20); // Assuming 20 items per page
            
            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let pagination = '<div class="flex items-center justify-between">';
            pagination += `<p class="text-sm text-gray-700">Showing ${((currentPage - 1) * 20) + 1} to ${Math.min(currentPage * 20, data.count)} of ${data.count} results</p>`;
            pagination += '<div class="flex space-x-2">';
            
            // Previous button
            if (currentPage > 1) {
                pagination += `<button onclick="loadStudents(${currentPage - 1})" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Previous</button>`;
            }
            
            // Page numbers
            for (let i = Math.max(1, currentPage - 2); i <= Math.min(totalPages, currentPage + 2); i++) {
                const isActive = i === currentPage;
                pagination += `<button onclick="loadStudents(${i})" class="px-3 py-1 border ${isActive ? 'bg-blue-600 text-white border-blue-600' : 'border-gray-300 hover:bg-gray-50'} rounded text-sm">${i}</button>`;
            }
            
            // Next button
            if (currentPage < totalPages) {
                pagination += `<button onclick="loadStudents(${currentPage + 1})" class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Next</button>`;
            }
            
            pagination += '</div></div>';
            container.innerHTML = pagination;
        }

        function handleFilter() {
            currentPage = 1;
            loadStudents(1);
        }

        async function viewStudent(studentId) {
            try {
                showLoading();
                const response = await api.students.getProfile(studentId);
                const student = response.data;
                
                const modalContent = document.getElementById('studentModalContent');
                modalContent.innerHTML = `
                    <div class="space-y-6">
                        <div class="flex items-center space-x-4">
                            <div class="w-16 h-16 rounded-full flex items-center justify-center text-white text-xl font-bold" style="background: var(--brand-primary);">
                                ${(student.first_name?.[0] || '') + (student.last_name?.[0] || '')}
                            </div>
                            <div>
                                <h4 class="text-xl font-semibold text-gray-900">${student.first_name} ${student.last_name}</h4>
                                <p class="text-gray-600">${student.email}</p>
                                <p class="text-gray-600">${student.phone || 'No phone number'}</p>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <h5 class="font-medium text-gray-900 mb-2">Academic Information</h5>
                                <p class="text-sm text-gray-600">University: ${student.university || 'Not specified'}</p>
                                <p class="text-sm text-gray-600">Major: ${student.major || 'Not specified'}</p>
                                <p class="text-sm text-gray-600">Year: ${student.year || 'Not specified'}</p>
                                <p class="text-sm text-gray-600">GPA: ${student.gpa || 'Not provided'}</p>
                            </div>
                            <div>
                                <h5 class="font-medium text-gray-900 mb-2">Additional Info</h5>
                                <p class="text-sm text-gray-600">Date of Birth: ${student.date_of_birth || 'Not provided'}</p>
                                <p class="text-sm text-gray-600">Location: ${student.location || 'Not specified'}</p>
                                <p class="text-sm text-gray-600">Joined: ${formatDate(student.created_at)}</p>
                            </div>
                        </div>
                        
                        ${student.bio ? `
                        <div>
                            <h5 class="font-medium text-gray-900 mb-2">Bio</h5>
                            <p class="text-sm text-gray-600">${student.bio}</p>
                        </div>
                        ` : ''}
                        
                        <div class="flex justify-end space-x-3 pt-4 border-t border-gray-200">
                            <button onclick="messageStudent(${student.id})" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors">
                                <i class="fas fa-envelope mr-2"></i>Message
                            </button>
                            <button onclick="window.open('${student.resume || '#'}', '_blank')" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors" ${!student.resume ? 'disabled' : ''}>
                                <i class="fas fa-file-pdf mr-2"></i>View Resume
                            </button>
                        </div>
                    </div>
                `;
                
                hideLoading();
                showStudentModal();
            } catch (error) {
                console.error('Error loading student:', error);
                showToast('Failed to load student details', 'error');
                hideLoading();
            }
        }

        function messageStudent(studentId) {
            // Redirect to communications page with student filter
            window.location.href = `communications.html?student=${studentId}`;
        }

        function showStudentModal() {
            document.getElementById('studentModal').classList.remove('hidden');
        }

        function hideStudentModal() {
            document.getElementById('studentModal').classList.add('hidden');
        }

        function showInviteModal() {
            document.getElementById('inviteModal').classList.remove('hidden');
        }

        function hideInviteModal() {
            document.getElementById('inviteModal').classList.add('hidden');
            document.getElementById('inviteForm').reset();
        }

        async function handleSendInvites(e) {
            e.preventDefault();
            
            const emails = document.getElementById('inviteEmails').value
                .split('\n')
                .map(email => email.trim())
                .filter(email => email && email.includes('@'));
                
            const message = document.getElementById('inviteMessage').value;
            
            if (emails.length === 0) {
                showToast('Please enter valid email addresses', 'error');
                return;
            }
            
            try {
                showLoading();
                await api.organizations.inviteStudents({ emails, message });
                hideLoading();
                hideInviteModal();
                showToast(`Invitations sent to ${emails.length} students`, 'success');
            } catch (error) {
                console.error('Error sending invites:', error);
                hideLoading();
                showToast('Failed to send invitations', 'error');
            }
        }

        async function handleExport() {
            try {
                showLoading();
                const filters = {
                    search: document.getElementById('searchInput').value,
                    major: document.getElementById('majorFilter').value,
                    year: document.getElementById('yearFilter').value,
                    status: document.getElementById('statusFilter').value
                };
                
                const blob = await api.organizations.exportStudents(filters);
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `students_${new Date().toISOString().split('T')[0]}.csv`;
                a.click();
                window.URL.revokeObjectURL(url);
                
                hideLoading();
                showToast('Students data exported successfully', 'success');
            } catch (error) {
                console.error('Error exporting data:', error);
                hideLoading();
                showToast('Failed to export data', 'error');
            }
        }

        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        // Utility functions
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function formatDate(dateString) {
            if (!dateString) return 'N/A';
            return new Date(dateString).toLocaleDateString();
        }
    </script>
</body>
</html>
