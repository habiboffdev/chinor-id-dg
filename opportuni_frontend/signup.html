<!DOCTYPE html>
<html lang="en">
<head>

                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',

                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {

                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        accent: {

                            100: '#fae8ff',
                            200: '#f5d0fe',
                            300: '#f0abfc',
                            400: '#e879f9',
                            500: '#d946ef',
                            600: '#c026d3',
                            700: '#a21caf',
                            800: '#86198f',

                        }
                    },
                    animation: {

                    },
                    keyframes: {
                        fadeIn: {

                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(30px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        };
    </script>

</head>
<body class="theme-opportuni overflow-x-hidden">
        <!-- Header (brand) -->
        <header class="brand-nav fixed w-full top-0 z-50">
            <div class="container nav">
                <a class="text-2xl font-bold brand-wordmark" href="index.html">Opportuni</a>
                <nav class="hidden md:flex nav-links gap-2">
                    <a href="index.html#features">Features</a>
                    <a href="index.html#how">How it works</a>
                    <a href="signup.html?type=organization">For organizations</a>
                </nav>
                <div class="hidden md:flex nav-ctas gap-2">
                    <a href="login.html" class="btn btn--ghost">Sign in</a>
                </div>
                <button class="md:hidden btn btn--ghost" onclick="toggleMobileMenu()" aria-label="Open menu"><i class="fas fa-bars"></i></button>
            </div>
            <div id="mobile-menu" class="md:hidden hidden" style="border-top:1px solid var(--slate-400); background: var(--ink-900);">
                <div class="container py-3" style="display:grid; gap:8px;">
                    <a href="index.html#features">Features</a>
                    <a href="index.html#how">How it works</a>
                    <a href="signup.html?type=organization">For organizations</a>
                    <div style="display:flex; gap:8px; margin-top:8px;">
                        <a href="login.html" class="btn btn--ghost" style="flex:1;">Sign in</a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Layout -->
        <main class="auth-shell">
          <div class="container auth-center">
            <section style="width:100%; max-width:560px;">
                <div class="card">
                <h2 class="mb-2">Create your account</h2>
                    <p class="text-muted mb-6">Choose your account type and fill in the details.</p>

                    <div class="mb-6 segmented">
                        <button type="button" onclick="switchUserType('student')" id="btn-student" class="btn btn--secondary">Student</button>
                        <button type="button" onclick="switchUserType('organization')" id="btn-organization" class="btn btn--ghost">Organization</button>
                    </div>

                <form id="signup-form" class="space-y-5" data-user-type="student">
                                                <div id="student-fields" class="space-y-6">
                                                        <div class="field float">
                                                                <div class="with-icon float-wrap">
                                                                    <i class="icon fas fa-user"></i>
                                                                    <input type="text" id="name" name="name" required class="input input--line" placeholder=" ">
                                                                    <label for="name" class="float-label">Full Name</label>
                                                                </div>
                                                        </div>
                    
                                                        <div class="field float">
                                                                <div class="with-icon float-wrap">
                                                                    <i class="icon fas fa-envelope"></i>
                                                                    <input type="email" id="email" name="email" required class="input input--line" placeholder=" " autocomplete="email">
                                                                    <label for="email" class="float-label">Email</label>
                                                                </div>
                                                        </div>
                </div>
                
                <div id="organization-fields" class="space-y-6 hidden">
                                                            <div class="field float">
                                                                    <div class="with-icon float-wrap">
                                                                        <i class="icon fas fa-building"></i>
                                                                        <input type="text" id="org-name" name="org_name" class="input input--line" placeholder=" ">
                                                                        <label for="org-name" class="float-label">Organization Name</label>
                                                                    </div>
                                                            </div>
                    
                                                            <div class="field float">
                                                                    <div class="with-icon float-wrap">
                                                                        <i class="icon fas fa-at"></i>
                                                                        <input type="email" id="org-email" name="org_email" class="input input--line" placeholder=" ">
                                                                        <label for="org-email" class="float-label">Organization Email</label>
                                                                    </div>
                                                            </div>
                    
                                        <div class="field float">
                                                <div class="select-wrap with-icon float-wrap">
                                                    <i class="icon fas fa-layer-group"></i>
                                                    <select id="org-type" name="org_type" class="input input--line" data-has-value="false" onchange="this.setAttribute('data-has-value', this.value ? 'true' : 'false')" oninput="this.setAttribute('data-has-value', this.value ? 'true' : 'false')">
                                                        <option value="" disabled hidden selected>Select Organization Type</option>
                            <option value="university">University</option>
                            <option value="company">Company</option>
                            <option value="non-profit">Non-Profit Organization</option>
                            <option value="government">Government Agency</option>
                            <option value="other">Other</option>
                                                    </select>
                                                    <span class="select-chevron"><i class="fas fa-chevron-down"></i></span>
                                                    <label for="org-type" class="float-label">Organization Type</label>
                                                </div>
                                        </div>
                </div>
                
                <div class="field float">
                    <div class="relative float-wrap">
                        <input type="password" id="password" name="password" required class="input input--line" placeholder=" ">
                        <label for="password" class="float-label">Password</label>
                        <button type="button" onclick="togglePassword(this)" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="strength" id="pwdStrength" aria-hidden="true">
                      <div class="seg"></div><div class="seg"></div><div class="seg"></div><div class="seg"></div>
                    </div>
                    <div class="strength-label" id="pwdStrengthLabel"></div>
                </div>
                
                <div class="field float">
                    <div class="relative float-wrap">
                        <input type="password" id="confirm-password" name="confirm_password" required class="input input--line" placeholder=" ">
                        <label for="confirm-password" class="float-label">Confirm Password</label>
                        <button type="button" onclick="togglePassword(this)" 
                                class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="flex items-start">
                    <div class="flex items-center h-5">
                        <input type="checkbox" id="terms" name="terms" required class="checkbox">
                    </div>
                    <label for="terms" class="ml-2 text-sm" style="color: var(--mist-200);">
                        I agree to the <a href="#" style="color: var(--accent-2);">Terms of Service</a> and 
                        <a href="#" style="color: var(--accent-2);">Privacy Policy</a>
                    </label>
                </div>
                    <button type="submit" class="btn btn--secondary btn--lg w-full">Create Account</button>
                </form>
                                <div class="auth-divider" style="color: var(--mist-300);">or</div>
                                <p class="text-center" style="color: var(--mist-200);">Already have an account? <a href="login.html" style="color: var(--accent-2); font-weight:600;">Sign in</a></p>
            </div>
                </section>
            </div>
        </main>

        <!-- Footer -->
        <footer class="footer section">
            <div class="container">
                <div class="flex flex-col md:flex-row justify-between items-center">
                    <p class="text-sm">© 2025 Opportuni. All rights reserved.</p>
                    <div class="text-sm mt-2 md:mt-0" style="display:flex; gap:16px;">
                        <a href="#">Privacy Policy</a>
                        <a href="#">Terms of Service</a>
                        <a href="#">Contact</a>
                    </div>
                </div>
            </div>
        </footer>

        <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-20 right-4 z-50 space-y-2"></div>

    <!-- Scripts -->
        <script>
            function toggleMobileMenu(){var m=document.getElementById('mobile-menu'); if(!m) return; m.classList.toggle('hidden');}
        </script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Set up the signup form
            const signupForm = document.getElementById('signup-form');
            if (signupForm) {
                // Select placeholder/value color handling
                const orgTypeEl = document.getElementById('org-type');
                if (orgTypeEl) {
                    const updateSelectState = () => orgTypeEl.setAttribute('data-has-value', orgTypeEl.value ? 'true' : 'false');
                    // Initial paint
                    updateSelectState();
                    // Keep state synced across browsers
                    orgTypeEl.addEventListener('change', updateSelectState);
                    orgTypeEl.addEventListener('input', updateSelectState);
                    orgTypeEl.addEventListener('blur', updateSelectState);
                    // Expose for other handlers
                    window.__updateOrgTypeState = updateSelectState;
                }
                signupForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    try {
                        const userType = signupForm.getAttribute('data-user-type');
                        
                        // Form validation
                        const password = document.getElementById('password').value;
                        const confirmPassword = document.getElementById('confirm-password').value;
                        
                        if (password !== confirmPassword) {
                            showToast('Passwords do not match', 'error');
                            return;
                        }
                        
                        // Show loading state
                        const submitBtn = signupForm.querySelector('button[type="submit"]');
                        const originalBtnText = submitBtn.innerHTML;
                        submitBtn.disabled = true;
                        submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> Creating account...';
                        
                        // Prepare form data based on user type, matching backend expectations
                        let formData;
                        
                        // Get full name from the form
                        let fullName;
                        let email;
                        
                        if (userType === 'student') {
                            fullName = document.getElementById('name').value;
                            email = document.getElementById('email').value;
                        } else {
                            fullName = document.getElementById('org-name').value; // Organization name
                            email = document.getElementById('org-email').value;
                        }
                        
                        // Split name into first and last name
                        const nameParts = fullName.split(' ');
                        const firstName = nameParts[0] || '';
                        const lastName = nameParts.slice(1).join(' ') || '';
                        
                        // Create username from email (remove @ and domain)
                        const username = email.split('@')[0];
                        
                        formData = {
                            email: email,
                            username: username,
                            first_name: firstName,
                            last_name: lastName,
                            user_type: userType === 'student' ? 'student' : 'organization',
                            password: password,
                            password_confirm: password
                        };
                        
                        // Add org_type if it's an organization
                        if (userType === 'organization') {
                            formData.org_type = document.getElementById('org-type').value;
                        }
                        
                        // Call signup API
                        try {
                            await auth.register(formData);
                            showToast('Account created successfully! Redirecting to login...', 'success');
                            setTimeout(() => {
                                window.location.href = 'login.html';
                            }, 2000);
                        } catch (error) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = originalBtnText;
                            showToast(error.message || 'Registration failed. Please try again.', 'error');
                        }
                    } catch (error) {
                        console.error('Registration error:', error);
                        showToast(error.message || 'An unexpected error occurred', 'error');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = originalBtnText;
                    }
                });

                // Password strength meter
                const pwd = document.getElementById('password');
                const strength = document.getElementById('pwdStrength');
                const strengthLabel = document.getElementById('pwdStrengthLabel');
                if (pwd && strength && strengthLabel) {
                    const segs = Array.from(strength.querySelectorAll('.seg'));
                    const calc = (v) => {
                        let s = 0;
                        if (v.length >= 8) s++;
                        if (/[A-Z]/.test(v)) s++;
                        if (/[0-9]/.test(v)) s++;
                        if (/[^A-Za-z0-9]/.test(v)) s++;
                        return s;
                    };
                    const label = (s) => ['Very weak','Weak','Good','Strong'][Math.max(s-1,0)] || '';
                    const paint = (s) => {
                        segs.forEach((seg,i)=>{
                            seg.className = 'seg' + (i===0 && s>=1?' active-1':'') + (i===1 && s>=2?' active-2':'') + (i===2 && s>=3?' active-3':'') + (i===3 && s>=4?' active-4':'');
                        });
                        strengthLabel.textContent = s?label(s):'';
                        strength.setAttribute('aria-hidden', s? 'false':'true');
                    };
                    pwd.addEventListener('input', e => paint(calc(e.target.value)));
                }
            }
        });

        // Password toggle function
        function togglePassword(button) {
            const input = button.parentElement.querySelector('input');
            const icon = button.querySelector('i');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }
        
        // User type switcher
    function switchUserType(type) {
            const form = document.getElementById('signup-form');
            const studentFields = document.getElementById('student-fields');
            const orgFields = document.getElementById('organization-fields');
            const studentBtn = document.getElementById('btn-student');
            const orgBtn = document.getElementById('btn-organization');
            
            if (type === 'student') {
                form.setAttribute('data-user-type', 'student');
                studentFields.classList.remove('hidden');
                orgFields.classList.add('hidden');
        studentBtn.classList.add('btn--secondary');
        studentBtn.classList.remove('btn--ghost');
        orgBtn.classList.remove('btn--secondary');
        orgBtn.classList.add('btn--ghost');
                
                // Toggle required attributes
                document.getElementById('name').required = true;
                document.getElementById('email').required = true;
                document.getElementById('org-name').required = false;
                document.getElementById('org-email').required = false;
                document.getElementById('org-type').required = false;
            } else {
                form.setAttribute('data-user-type', 'organization');
                studentFields.classList.add('hidden');
                orgFields.classList.remove('hidden');
        studentBtn.classList.remove('btn--secondary');
        studentBtn.classList.add('btn--ghost');
        orgBtn.classList.remove('btn--ghost');
        orgBtn.classList.add('btn--secondary');
                
                // Toggle required attributes
                document.getElementById('name').required = false;
                document.getElementById('email').required = false;
                document.getElementById('org-name').required = true;
                document.getElementById('org-email').required = true;
                const s = document.getElementById('org-type');
                s.required = true;
                // Refresh select state so text color shows correctly when switching
                if (window.__updateOrgTypeState) window.__updateOrgTypeState();
            }
        }
        
        // Check URL parameters for user type
        document.addEventListener('DOMContentLoaded', function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('type') === 'organization') {
                switchUserType('organization');
            }
        });
    </script>
</body>
</html>
