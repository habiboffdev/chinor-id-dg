<!DOCTYPE html>
<html>
<head>
  <title>Test Wizard Steps</title>
  <style>
    .field { display: none; padding: 20px; border: 2px solid #ccc; margin: 10px 0; }
    .field:not(.hidden) { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="current-step">Step: <span id="step-num">1</span></div>
  
  <div class="field" data-step="title">
    <h2>Title Step</h2>
    <input type="text" placeholder="Enter title">
  </div>
  
  <div class="field hidden" data-step="description">
    <h2>Description Step</h2>
    <textarea placeholder="Enter description"></textarea>
  </div>
  
  <div class="field hidden" data-step="type">
    <h2>Type Step</h2>
    <select>
      <option>Internship</option>
      <option>Job</option>
    </select>
  </div>
  
  <button onclick="prev()" id="prev-btn" disabled>Previous</button>
  <button onclick="next()" id="next-btn">Next</button>
  
  <script>
    const steps = ['title', 'description', 'type'];
    let current = 0;
    
    function showStep(index) {
      current = Math.max(0, Math.min(steps.length-1, index));
      document.getElementById('step-num').textContent = current + 1;
      
      steps.forEach((stepName, i) => {
        const el = document.querySelector(`[data-step="${stepName}"]`);
        if (!el) return;
        
        if (i === current) {
          el.classList.remove('hidden');
        } else {
          el.classList.add('hidden');
        }
      });
      
      document.getElementById('prev-btn').disabled = current === 0;
      document.getElementById('next-btn').style.display = current === steps.length-1 ? 'none' : 'inline';
    }
    
    function next() { showStep(current + 1); }
    function prev() { showStep(current - 1); }
    
    // Initialize
    showStep(0);
  </script>
</body>
</html>
