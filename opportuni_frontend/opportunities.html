<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opportunities — Opportuni</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            200: '#bae6fd',
                            300: '#7dd3fc',
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" />
    <link href="https://fonts.cdnfonts.com/css/general-sans" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Brand theme + components -->
    <link rel="stylesheet" href="assets/css/theme.css?v=20250817-1" />
    <link rel="stylesheet" href="assets/css/components.css?v=20250817-1" />
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <style>
        /* Brand-aligned chips and inputs */
        .filter-quick-btn {
            padding: 8px 12px;
            background: rgba(255,255,255,0.04);
            color: var(--mist-200);
            border-radius: 12px;
            transition: 150ms ease-out;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid var(--slate-400);
            cursor: pointer;
        }
        .filter-quick-btn:hover { background: rgba(255,255,255,0.07); border-color: var(--mist-300); }
        .filter-quick-btn.active { background: rgba(108,99,255,0.18); color: var(--accent-2); border-color: rgba(108,99,255,0.45); }

        .active-filter-tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(108,99,255,0.18); color: var(--accent-2); border: 1px solid rgba(108,99,255,0.35); }
        .active-filter-tag button { margin-left: 6px; color: var(--accent-2); }
        .active-filter-tag button:hover { filter: brightness(1.1); }

        .search-suggestion-item { padding: 8px 12px; font-size: 0.9rem; color: var(--mist-200); cursor: pointer; border-bottom: 1px solid var(--slate-400); }
        .search-suggestion-item:last-child { border-bottom: none; }
        .search-suggestion-item:hover { background: var(--ink-800); color: var(--white-0); }

        .recent-search-tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: rgba(255,255,255,0.06); color: var(--mist-200); border: 1px solid var(--slate-400); cursor: pointer; }
        .recent-search-tag:hover { background: rgba(255,255,255,0.08); }

        .skill-tag { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: rgba(108,99,255,0.18); color: var(--accent-2); border: 1px solid rgba(108,99,255,0.35); }
        .skill-tag button { margin-left: 6px; color: var(--accent-2); }
        .skill-tag button:hover { filter: brightness(1.1); }

        .skill-suggestion { padding: 8px 10px; font-size: 0.9rem; color: var(--mist-200); cursor: pointer; border-bottom: 1px solid var(--slate-400); }
        .skill-suggestion:last-child { border-bottom: none; }
        .skill-suggestion:hover { background: var(--ink-800); }

        .filter-section-loading { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; background: var(--ink-800); height: 40px; border-radius: 12px; }
        .opportunities-grid, .opportunities-list { transition: all 0.25s ease; }

    /* Compact search */
    .search-input { height: 44px; padding-left: 52px; padding-right: 52px; }
    .search-icon { left: 0; color: var(--mist-300); z-index: 1; }
    .search-tools { right: 12px; color: var(--mist-300); z-index: 1; }

        /* Toolbar layout */
        .results-toolbar { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; }
    .toolbar-left { display: grid; gap: 10px; }
    .toolbar-left > .relative { margin-bottom: 6px; }
        .toolbar-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .toolbar-right { display: flex; gap: 16px; align-items: center; justify-content: flex-end; }
    #results-count { padding-right: 2px; }
    .view-toggle { display: inline-flex; gap: 8px; }
    .view-toggle button { border: 1px solid var(--slate-400); border-radius: 10px; width: 36px; height: 36px; display: grid; place-items: center; color: var(--mist-300); }
        .view-toggle button.active { background: rgba(108,99,255,0.18); color: var(--accent-2); border-color: rgba(108,99,255,0.45); }

        /* Suggestions scrollbars */
        .suggestions-container { scrollbar-width: thin; scrollbar-color: var(--slate-400) var(--ink-900); }
        .suggestions-container::-webkit-scrollbar { width: 6px; }
        .suggestions-container::-webkit-scrollbar-track { background: var(--ink-900); }
        .suggestions-container::-webkit-scrollbar-thumb { background: var(--slate-400); border-radius: 3px; }
    /* Ensure input text sits above background but below tools/icons */
    .search-input { position: relative; z-index: 3; }
    /* Suggestions appear over everything else in the search group */
    #search-suggestions { z-index: 30; }

    /* Ensure dropdowns aren't clipped by nav containers */
    .brand-nav { position: relative; z-index: 60; overflow: visible; background: var(--ink-900); isolation: isolate; }
    /* Specificity bump to override global body.theme-opportuni .brand-nav z-index */
    body.theme-opportuni .brand-nav { z-index: 60 !important; }
    .nav-inner { position: relative; z-index: 70; }
    .brand-nav .user-menu { overflow: visible; }
    .brand-nav .user-menu > .relative { overflow: visible; }
    /* Explicitly anchor dropdowns below trigger; remove extra margin offsets */
    .brand-nav .user-menu > .relative > #user-dropdown,
    .brand-nav .user-menu > .relative > #notifications-dropdown {
        top: calc(100% + 8px);
        margin-top: 0 !important;
    }

        /* Focus ring */
        .opportunity-filter:focus, #opportunity-search:focus, #skills-input:focus { outline: none; box-shadow: var(--focus-ring); border-color: var(--accent-2); }

        /* Pulse animation */
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

        /* Responsive */
        @media (max-width: 640px) {
            .toolbar-right { justify-content: stretch; }
            .results-toolbar { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="theme-opportuni">
    <!-- Student Navbar (shared component) -->
    <div id="student-navbar-root"></div>

    <!-- Main Content -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold mb-1" style="font-family: var(--font-display);">Opportunities</h1>
            <p class="text-muted">Search and filter to find your next move.</p>
        </div>

        <!-- Search + Toolbar (compact) -->
        <div class="card card--soft p-4 mb-6">
            <div class="results-toolbar">
                <div class="toolbar-left">
                    <div class="relative">
                        <input type="text" id="opportunity-search" placeholder="Search by title, organization, keywords, skills..." class="w-full input input--line search-input" autocomplete="off" style="padding-left:56px; padding-right:56px;">
                        <div class="absolute inset-y-0 left-0 flex items-center pointer-events-none search-icon" style="width:40px; justify-content:center;"><i class="fas fa-search"></i></div>
                        <div class="absolute inset-y-0 right-0 pr-3 flex items-center space-x-2 search-tools">
                            <button id="advanced-search-btn" onclick="toggleAdvancedFilters()" title="Advanced Filters" class="hover:opacity-90"><i class="fas fa-sliders-h"></i></button>
                            <button id="clear-search" class="hidden hover:opacity-90" onclick="clearSearch()"><i class="fas fa-times"></i></button>
                        </div>
                        <!-- Suggestions -->
                        <div id="search-suggestions" class="hidden absolute top-full left-0 right-0 rounded-lg shadow-lg mt-1 z-10 max-h-64 overflow-y-auto suggestions-container" style="background: var(--ink-900); border:1px solid var(--slate-400);"></div>
                    </div>
                    <div id="recent-searches" class="hidden">
                        <label class="block text-xs mb-1" style="color: var(--mist-300);">Recent</label>
                        <div class="toolbar-chips" id="recent-searches-list"></div>
                    </div>
                    <div class="toolbar-chips">
                        <button class="filter-quick-btn" data-filter="deadline" data-value="week" onclick="applyQuickFilter('deadline','week')"><i class="fas fa-clock mr-2"></i>This Week</button>
                        <button class="filter-quick-btn" data-filter="opportunity_type" data-value="internship" onclick="applyQuickFilter('opportunity_type','internship')"><i class="fas fa-briefcase mr-2"></i>Internships</button>
                        <button class="filter-quick-btn" data-filter="opportunity_type" data-value="scholarship" onclick="applyQuickFilter('opportunity_type','scholarship')"><i class="fas fa-graduation-cap mr-2"></i>Scholarships</button>
                        <button class="filter-quick-btn" data-filter="location" data-value="remote" onclick="applyQuickFilter('location','remote')"><i class="fas fa-home mr-2"></i>Remote</button>
                        <button class="filter-quick-btn" data-filter="featured" data-value="true" onclick="applyQuickFilter('featured','true')"><i class="fas fa-star mr-2"></i>Featured</button>
                        <button class="filter-quick-btn" onclick="clearAllFilters()"><i class="fas fa-filter mr-2"></i>Clear All</button>
                    </div>
                </div>
                <div class="toolbar-right">
                    <span id="results-count" class="text-sm" style="color: var(--mist-300);">Loading…</span>
                    <div class="view-toggle">
                        <button onclick="setViewMode('grid')" id="grid-view-btn" class="active"><i class="fas fa-th-large"></i></button>
                        <button onclick="setViewMode('list')" id="list-view-btn"><i class="fas fa-list"></i></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filters Panel (lightweight) -->
        <div class="card card--soft p-4 mb-8">
            <div class="grid grid-cols-1 lg:grid-cols-4 gap-4">
                <!-- Type Filter -->
                <div>
                    <label class="block text-sm font-medium mb-2">Type</label>
                    <select name="opportunity_type" class="opportunity-filter w-full input input--line">
                        <option value="">All Types</option>
                        <option value="internship">Internship</option>
                        <option value="scholarship">Scholarship</option>
                        <option value="competition">Competition</option>
                        <option value="volunteer">Volunteer</option>
                        <option value="job">Job</option>
                        <option value="workshop">Workshop</option>
                        <option value="conference">Conference</option>
                    </select>
                </div>
                
                <!-- Location Filter -->
                <div>
                    <label class="block text-sm font-medium mb-2">Location</label>
                    <input type="text" 
                           name="location" 
                           placeholder="Enter location (e.g., ddd, remote, online)" 
                           class="opportunity-filter w-full input input--line">
                </div>
                
                <!-- Deadline Filter -->
                <div>
                    <label class="block text-sm font-medium mb-2">Application Deadline</label>
                    <select name="deadline" class="opportunity-filter w-full input input--line">
                        <option value="">Any Time</option>
                        <option value="week">This Week</option>
                        <option value="month">This Month</option>
                        <option value="quarter">Next 3 Months</option>
                    </select>
                </div>
                
                <!-- Sort Filter -->
                <div>
                    <label class="block text-sm font-medium mb-2">Sort By</label>
                    <select name="sort" class="opportunity-filter w-full input input--line">
                        <option value="-created_at">Newest First</option>
                        <option value="application_deadline">Deadline (Earliest)</option>
                        <option value="-application_deadline">Deadline (Latest)</option>
                        <option value="title">Title (A-Z)</option>
                        <option value="-title">Title (Z-A)</option>
                        <option value="relevance">Most Relevant</option>
                    </select>
                </div>
            </div>
            <div class="border-t mt-4 pt-4" style="border-color: var(--slate-400);">
                <button id="toggle-advanced-btn" onclick="toggleAdvancedFilters()" class="flex items-center font-medium" style="color: var(--accent-3);">
                    <span id="advanced-filters-text">Show Advanced Filters</span>
                    <i id="advanced-filters-icon" class="fas fa-chevron-down ml-2 transition-transform"></i>
                </button>
                <div id="advanced-filters" class="hidden mt-4 space-y-6">
                    <!-- Skills and Requirements -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Required Skills</label>
                            <div class="relative">
                                <input type="text" 
                                       name="skills" 
                                       id="skills-input"
                                       placeholder="Type skills (e.g., JavaScript, Python, Design...)" 
                                       class="opportunity-filter w-full input input--line">
                                <div id="skills-suggestions" class="hidden absolute top-full left-0 right-0 rounded-lg shadow-lg mt-1 z-10 max-h-32 overflow-y-auto suggestions-container" style="background: var(--ink-900); border:1px solid var(--slate-400);">
                                    <!-- Skills suggestions -->
                                </div>
                            </div>
                            <div id="selected-skills" class="mt-2 flex flex-wrap gap-2">
                                <!-- Selected skills will appear here -->
                            </div>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">Organization Type</label>
                            <select name="organization_type" class="opportunity-filter w-full input input--line">
                                <option value="">Any Organization</option>
                                <option value="startup">Startup</option>
                                <option value="corporation">Corporation</option>
                                <option value="nonprofit">Non-Profit</option>
                                <option value="government">Government</option>
                                <option value="education">Educational Institution</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Additional Filters -->
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-sm font-medium mb-2">Minimum GPA</label>
                            <select name="min_gpa" class="opportunity-filter w-full input input--line">
                                <option value="">No Requirement</option>
                                <option value="2.0">2.0+</option>
                                <option value="2.5">2.5+</option>
                                <option value="3.0">3.0+</option>
                                <option value="3.5">3.5+</option>
                                <option value="3.8">3.8+</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">Duration</label>
                            <select name="duration" class="opportunity-filter w-full input input--line">
                                <option value="">Any Duration</option>
                                <option value="short">Short-term (< 3 months)</option>
                                <option value="medium">Medium-term (3-6 months)</option>
                                <option value="long">Long-term (6+ months)</option>
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium mb-2">Compensation</label>
                            <select name="compensation" class="opportunity-filter w-full input input--line">
                                <option value="">Any</option>
                                <option value="paid">Paid</option>
                                <option value="unpaid">Unpaid</option>
                                <option value="stipend">Stipend</option>
                            </select>
                        </div>
                    </div>
                    
                    <!-- Saved Filters -->
                    <div>
                        <label class="block text-sm font-medium mb-2">Saved Filter Sets</label>
                        <div class="flex items-center space-x-4">
                            <select id="saved-filters" class="flex-1 input input--line">
                                <option value="">Select a saved filter set...</option>
                                <!-- Saved filters will be loaded here -->
                            </select>
                            <button onclick="saveCurrentFilters()" class="btn btn--outline">
                                <i class="fas fa-save mr-2"></i>Save Current
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Active filters row -->
            <div class="mt-4">
                <div id="active-filters" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
        
        <!-- Opportunities Grid/List -->
        <div id="opportunities-container" class="opportunities-grid">
            <!-- Loading skeleton -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="loading-skeleton">
                <div class="card card--soft animate-pulse">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="h-4 rounded w-3/4 mb-2" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-1/2 mb-4" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-full mb-2" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-2/3" style="background: var(--ink-800);"></div>
                        </div>
                        <div class="w-16 h-6 rounded-full" style="background: var(--ink-800);"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-2">
                            <div class="w-12 h-5 rounded-full" style="background: var(--ink-800);"></div>
                            <div class="w-16 h-5 rounded-full" style="background: var(--ink-800);"></div>
                        </div>
                        <div class="w-20 h-8 rounded" style="background: var(--ink-800);"></div>
                    </div>
                </div>
                <div class="card card--soft animate-pulse">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="h-4 rounded w-3/4 mb-2" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-1/2 mb-4" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-full mb-2" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-2/3" style="background: var(--ink-800);"></div>
                        </div>
                        <div class="w-16 h-6 rounded-full" style="background: var(--ink-800);"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-2">
                            <div class="w-12 h-5 rounded-full" style="background: var(--ink-800);"></div>
                            <div class="w-16 h-5 rounded-full" style="background: var(--ink-800);"></div>
                        </div>
                        <div class="w-20 h-8 rounded" style="background: var(--ink-800);"></div>
                    </div>
                </div>
                <div class="card card--soft animate-pulse">
                    <div class="flex justify-between items-start mb-4">
                        <div class="flex-1">
                            <div class="h-4 rounded w-3/4 mb-2" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-1/2 mb-4" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-full mb-2" style="background: var(--ink-800);"></div>
                            <div class="h-3 rounded w-2/3" style="background: var(--ink-800);"></div>
                        </div>
                        <div class="w-16 h-6 rounded-full" style="background: var(--ink-800);"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex space-x-2">
                            <div class="w-12 h-5 rounded-full" style="background: var(--ink-800);"></div>
                            <div class="w-16 h-5 rounded-full" style="background: var(--ink-800);"></div>
                        </div>
                        <div class="w-20 h-8 rounded" style="background: var(--ink-800);"></div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Pagination -->
        <div id="pagination-container" class="mt-8">
            <!-- Pagination will be loaded here -->
        </div>
    </div>

    <!-- Application Modal -->
    <div id="applicationModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto">
            <div class="p-6 border-b border-gray-200">
                <div class="flex justify-between items-center">
                    <h2 class="text-xl font-semibold text-gray-900">Apply to Opportunity</h2>
                    <button id="closeApplicationModal" class="text-gray-400 hover:text-gray-600">
                        <i class="fas fa-times text-lg"></i>
                    </button>
                </div>
                <div id="opportunityTitle" class="text-sm text-gray-600 mt-2"></div>
            </div>
            
            <form id="applicationForm" class="p-6 space-y-6">
                <!-- Dynamic Questions Container -->
                <div id="dynamicQuestions" class="space-y-4">
                    <!-- Questions will be loaded dynamically -->
                </div>
                
                <!-- Additional Documents Section -->
                <div class="border-t pt-6">
                    <h3 class="text-lg font-medium text-gray-900 mb-4">Additional Documents</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">
                                Upload Documents (Optional)
                            </label>
                            <div id="documentUploadArea" class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-gray-400 transition-colors">
                                <input type="file" id="documentUpload" class="hidden" multiple accept=".pdf,.doc,.docx,.txt,.jpg,.jpeg,.png">
                                <i class="fas fa-cloud-upload-alt text-gray-400 text-3xl mb-2"></i>
                                <p class="text-gray-600 mb-2">Click to upload files or drag and drop</p>
                                <p class="text-sm text-gray-500">PDF, DOC, DOCX, TXT, JPG, PNG (Max 10MB each)</p>
                            </div>
                            <div id="uploadedFiles" class="mt-3 space-y-2">
                                <!-- Uploaded files will appear here -->
                            </div>
                        </div>
                        
                        <div>
                            <label for="applicationNotes" class="block text-sm font-medium text-gray-700 mb-2">
                                Additional Notes (Optional)
                            </label>
                            <textarea id="applicationNotes" name="notes" rows="4" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent" placeholder="Any additional information you'd like to share..."></textarea>
                        </div>
                    </div>
                </div>
                
                <!-- Submit Button -->
                <div class="border-t pt-6 flex justify-end space-x-3">
                    <button type="button" id="cancelApplication" class="px-4 py-2 text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 transition-colors">
                        Cancel
                    </button>
                    <button type="submit" id="submitApplication" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">
                        <span id="submitButtonText">Submit Application</span>
                        <i id="submitSpinner" class="fas fa-spinner fa-spin ml-2 hidden"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading-spinner" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 flex flex-col items-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-primary-600 mb-4"></div>
