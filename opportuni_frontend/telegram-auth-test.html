<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Auth Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
        .info { background-color: #d1ecf1; color: #0c5460; }
        #telegram-login {
            margin: 20px 0;
            text-align: center;
        }
        pre {
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
    </style>
</head>
<body>
    <h1>Telegram Authentication Test</h1>
    
    <div id="status" class="status info">
        Initializing Telegram login widget...
    </div>
    
    <div id="telegram-login">
        <!-- Telegram login widget will be inserted here -->
    </div>
    
    <div id="result" style="display: none;">
        <h3>Authentication Result:</h3>
        <pre id="result-data"></pre>
    </div>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const resultDiv = document.getElementById('result');
        const resultData = document.getElementById('result-data');
        
        function updateStatus(message, type = 'info') {
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
        
        // Initialize Telegram Login Widget
        async function initializeTelegramLogin() {
            try {
                updateStatus('Fetching bot configuration...');
                
                const response = await api.get('/auth/telegram-config/');
                const botName = response.bot_username;
                
                if (!botName) {
                    updateStatus('Bot username not configured in backend', 'error');
                    return;
                }
                
                updateStatus(`Bot username: ${botName}. Loading widget...`);
                
                // Create Telegram login button
                const script = document.createElement('script');
                script.src = 'https://telegram.org/js/telegram-widget.js?22';
                script.setAttribute('data-telegram-login', botName);
                script.setAttribute('data-size', 'large');
                script.setAttribute('data-onauth', 'onTelegramAuth(user)');
                script.setAttribute('data-request-access', 'write');
                
                document.getElementById('telegram-login').appendChild(script);
                
                updateStatus('Telegram login widget loaded successfully!', 'success');
                
            } catch (error) {
                updateStatus(`Failed to initialize: ${error.message}`, 'error');
                console.error('Init error:', error);
            }
        }
        
        // Handle Telegram authentication
        async function onTelegramAuth(user) {
            try {
                updateStatus('Authenticating with backend...', 'info');
                
                console.log('Telegram user data:', user);
                
                const response = await api.post('/auth/telegram-auth/', user);
                
                updateStatus('Authentication successful!', 'success');
                
                resultData.textContent = JSON.stringify(response, null, 2);
                resultDiv.style.display = 'block';
                
                console.log('Backend response:', response);
                
            } catch (error) {
                updateStatus(`Authentication failed: ${error.message}`, 'error');
                console.error('Auth error:', error);
            }
        }
        
        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', initializeTelegramLogin);
    </script>
</body>
</html>
