<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Dashboard Redirect</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #1a1a1a; color: #fff; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #333; border-radius: 5px; }
        .debug-section h3 { margin-top: 0; color: #4CAF50; }
        pre { background: #2a2a2a; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 20px; margin: 5px; border-radius: 3px; cursor: pointer; }
        button:hover { background: #45a049; }
        .error { color: #ff6b6b; }
        .success { color: #4CAF50; }
        .warning { color: #ffa726; }
        #console-output { background: #2a2a2a; padding: 10px; border-radius: 3px; height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
    </style>
</head>
<body>
    <h1>🐛 Debug Dashboard Redirect Issue</h1>

    <div class="debug-section">
        <h3>Authentication Status</h3>
        <p>Token: <span id="auth-token">Loading...</span></p>
        <p>User: <span id="current-user">Loading...</span></p>
        <p>Logged In: <span id="is-logged-in">Loading...</span></p>
        <button onclick="checkAuthStatus()">Refresh Auth Status</button>
        <button onclick="tryLogin()">Test Login</button>
    </div>

    <div class="debug-section">
        <h3>Dashboard Redirect Test</h3>
        <button onclick="testRedirect()">Test Redirect</button>
        <button onclick="manualRedirect()">Manual Redirect to Dashboard</button>
        <p id="redirect-status">Ready to test...</p>
    </div>

    <div class="debug-section">
        <h3>JavaScript Errors & Console</h3>
        <div id="console-output">Console output will appear here...</div>
        <button onclick="clearConsole()">Clear</button>
    </div>

    <div class="debug-section">
        <h3>Script Loading Status</h3>
        <ul id="script-status">
            <li>Checking scripts...</li>
        </ul>
    </div>

    <!-- Load the same scripts as index.html -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>

    <script>
        // Console capture for debugging
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const originalConsoleWarn = console.warn;
        
        function addToConsole(message, type = 'log') {
            const output = document.getElementById('console-output');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : (type === 'warn' ? 'warning' : '');
            output.innerHTML += `<div class="${className}">[${timestamp}] ${message}</div>`;
            output.scrollTop = output.scrollHeight;
        }
        
        console.log = function(...args) {
            addToConsole(args.join(' '), 'log');
            originalConsoleLog.apply(console, args);
        };
        
        console.error = function(...args) {
            addToConsole('ERROR: ' + args.join(' '), 'error');
            originalConsoleError.apply(console, args);
        };
        
        console.warn = function(...args) {
            addToConsole('WARN: ' + args.join(' '), 'warn');
            originalConsoleWarn.apply(console, args);
        };

        // Catch global errors
        window.addEventListener('error', function(e) {
            addToConsole(`Global Error: ${e.message} at ${e.filename}:${e.lineno}`, 'error');
        });

        // Check script loading
        function checkScripts() {
            const scripts = ['Utils', 'api', 'auth', 'showToast', 'showLoading'];
            const status = document.getElementById('script-status');
            const results = scripts.map(script => {
                const exists = window[script] !== undefined;
                const className = exists ? 'success' : 'error';
                return `<li class="${className}">${script}: ${exists ? '✓ Loaded' : '✗ Missing'}</li>`;
            });
            status.innerHTML = results.join('');
        }

        // Auth status checking
        async function checkAuthStatus() {
            try {
                const token = Utils?.storage?.get('auth_token');
                const isLoggedIn = auth?.isLoggedIn();
                const currentUser = auth?.getCurrentUser();
                
                document.getElementById('auth-token').textContent = token ? `${token.substring(0, 20)}...` : 'None';
                document.getElementById('is-logged-in').textContent = isLoggedIn ? 'Yes' : 'No';
                document.getElementById('current-user').textContent = currentUser ? JSON.stringify(currentUser, null, 2) : 'None';
                
                console.log('Auth check complete', { token: !!token, isLoggedIn, currentUser });
            } catch (error) {
                console.error('Auth check failed:', error);
                document.getElementById('auth-token').textContent = 'Error';
                document.getElementById('is-logged-in').textContent = 'Error';
                document.getElementById('current-user').textContent = 'Error';
            }
        }

        // Test login
        async function tryLogin() {
            try {
                console.log('Attempting test login...');
                // Try to login with test credentials
                const result = await auth.login({
                    email: 'test@example.com',
                    password: 'testpassword'
                });
                console.log('Login result:', result);
                setTimeout(checkAuthStatus, 1000);
            } catch (error) {
                console.error('Login failed:', error);
            }
        }

        // Test redirect
        function testRedirect() {
            try {
                console.log('Testing redirect...');
                document.getElementById('redirect-status').textContent = 'Testing redirect...';
                
                if (!auth) {
                    document.getElementById('redirect-status').textContent = 'ERROR: auth object not found';
                    return;
                }
                
                if (!auth.redirectToDashboard) {
                    document.getElementById('redirect-status').textContent = 'ERROR: redirectToDashboard method not found';
                    return;
                }
                
                auth.redirectToDashboard();
                document.getElementById('redirect-status').textContent = 'Redirect called successfully';
            } catch (error) {
                console.error('Redirect test failed:', error);
                document.getElementById('redirect-status').textContent = `ERROR: ${error.message}`;
            }
        }

        // Manual redirect
        function manualRedirect() {
            console.log('Manual redirect to dashboard.html');
            window.location.href = 'dashboard.html';
        }

        // Clear console
        function clearConsole() {
            document.getElementById('console-output').innerHTML = '';
        }

        // Initialize on load
        window.addEventListener('DOMContentLoaded', function() {
            console.log('Debug page loaded');
            checkScripts();
            setTimeout(checkAuthStatus, 1000); // Give scripts time to load
        });
    </script>
</body>
</html>
