<!DOCTYPE html>
<html>
<head>
    <title>Quick Debug Login</title>
</head>
<body>
    <h1>Quick Debug Login</h1>
    <form id="loginForm">
        <div>
            <label>Email:</label>
            <input type="email" id="email" value="chinor@opportuni.app" required>
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="password" value="password123" required>
        </div>
        <button type="submit">Login</button>
    </form>
    
    <div id="result"></div>
    
    <script>
        // Set API base URL
        try {
            const origin = window.location.origin;
            window.API_BASE_URL = origin.replace(':8080', ':8000') + '/api';
        } catch (e) { 
            window.API_BASE_URL = '/api'; 
        }
    </script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                resultDiv.innerHTML = 'Logging in...';
                
                const response = await window.api.auth.login({
                    email: email,
                    password: password
                });
                
                console.log('Login response:', response);
                
                if (response.access) {
                    // Store tokens
                    Utils.storage.set('auth_token', response.access);
                    Utils.storage.set('refresh_token', response.refresh);
                    
                    // Set token in API
                    window.api.setToken(response.access);
                    
                    // Get profile
                    const profile = await window.api.auth.getProfile();
                    console.log('Profile:', profile);
                    
                    resultDiv.innerHTML = `
                        <h3>Login Successful!</h3>
                        <p><strong>User Type:</strong> ${profile.user_type}</p>
                        <p><strong>Access Token:</strong> ${response.access.substring(0, 50)}...</p>
                        <p><strong>Profile:</strong> ${JSON.stringify(profile, null, 2)}</p>
                        <p><a href="organization/opportunities.html">Go to Opportunities</a></p>
                    `;
                } else {
                    resultDiv.innerHTML = '<p style="color: red;">Login failed: No access token received</p>';
                }
                
            } catch (error) {
                console.error('Login error:', error);
                resultDiv.innerHTML = `<p style="color: red;">Login error: ${error.message}</p>`;
            }
        });
    </script>
</body>
</html>
