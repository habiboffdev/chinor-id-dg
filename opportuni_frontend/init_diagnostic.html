<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initialization Diagnostic</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 p-8">
    <h1 class="text-2xl font-bold mb-4">Initialization Diagnostic</h1>
    
    <div class="bg-white p-6 rounded-lg shadow mb-4">
        <h2 class="text-lg font-bold mb-2">Diagnostic Results</h2>
        <div id="diagnostic-results"></div>
    </div>

    <!-- Include scripts -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        function log(message) {
            const div = document.createElement('div');
            div.className = 'mb-2 text-sm font-mono';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            document.getElementById('diagnostic-results').appendChild(div);
            console.log(message);
        }

        function checkAPIAccess() {
            log('Checking API access...');
            
            fetch('http://localhost:8000/api/opportunities/')
                .then(response => {
                    log(`API Response Status: ${response.status}`);
                    if (response.ok) {
                        return response.json();
                    }
                    throw new Error(`HTTP ${response.status}`);
                })
                .then(data => {
                    log(`API Data: ${JSON.stringify(data, null, 2)}`);
                    log(`Opportunities found: ${data.results ? data.results.length : 0}`);
                })
                .catch(error => {
                    log(`API Error: ${error.message}`);
                });
        }

        function checkGlobalState() {
            log('Checking global state...');
            log(`Utils available: ${typeof Utils !== 'undefined'}`);
            log(`API available: ${typeof api !== 'undefined'}`);
            log(`Auth available: ${typeof auth !== 'undefined'}`);
            
            // Check if we can get DOM elements
            const container = document.getElementById('opportunities-container');
            log(`Opportunities container exists: ${!!container}`);
            
            const activeFilters = document.getElementById('active-filters');
            log(`Active filters container exists: ${!!activeFilters}`);
        }

        function simulateInitialization() {
            log('Simulating initialization...');
            
            // Check if API can be called
            if (typeof api !== 'undefined' && api.opportunities) {
                log('Testing API call...');
                api.opportunities.getList({ page: 1, page_size: 12 })
                    .then(response => {
                        log(`API call successful: ${JSON.stringify(response, null, 2)}`);
                    })
                    .catch(error => {
                        log(`API call failed: ${error.message}`);
                    });
            } else {
                log('API not available for testing');
            }
        }

        // Start diagnostics
        document.addEventListener('DOMContentLoaded', function() {
            log('=== STARTING DIAGNOSTIC ===');
            checkGlobalState();
            
            setTimeout(() => {
                checkAPIAccess();
                simulateInitialization();
            }, 500);
        });
    </script>
</body>
</html>
