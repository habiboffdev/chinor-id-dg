<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal Debug - Opportuni</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            200: '#bfdbfe',
                            300: '#93c5fd',
                            400: '#60a5fa',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        secondary: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            300: '#5eead4',
                            400: '#2dd4bf',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            900: '#134e4a',
                        }
                    }
                }
            }
        };
    </script>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="p-8 bg-gray-100">
    <h1 class="text-2xl font-bold mb-4">Modal Debug Page</h1>
    
    <div class="space-y-4">
        <button onclick="testBasicModal()" class="bg-blue-500 text-white px-4 py-2 rounded">Create Basic Modal</button>
        <button onclick="testShowLoginModal()" class="bg-green-500 text-white px-4 py-2 rounded">Test Login Modal</button>
        <button onclick="testShowRegisterModal()" class="bg-purple-500 text-white px-4 py-2 rounded">Test Register Modal</button>
        <button onclick="testCreateModal()" class="bg-yellow-500 text-white px-4 py-2 rounded">Test createModal Directly</button>
        <button onclick="debugUtils()" class="bg-orange-500 text-white px-4 py-2 rounded">Debug Utils</button>
        <button onclick="testRawHTML()" class="bg-red-500 text-white px-4 py-2 rounded">Test Raw HTML</button>
        <button onclick="testDirectInject()" class="bg-green-700 text-white px-4 py-2 rounded">Inject HTML Directly</button>
    </div>
    
    <div id="results" class="mt-4 p-4 bg-white rounded shadow"></div>
    
    <div id="htmlContent" class="mt-4 p-4 bg-white rounded shadow hidden">
        <h3 class="font-bold text-lg mb-2">Raw HTML Content</h3>
        <pre id="htmlDisplay" class="bg-gray-100 p-2 overflow-auto max-h-[400px] text-xs"></pre>
        <button onclick="document.getElementById('htmlContent').classList.add('hidden')" class="mt-2 bg-red-500 text-white px-3 py-1 rounded">Hide</button>
    </div>
    
    <!-- Include all the JS files -->
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/components.js"></script>
    <script src="assets/js/main.js"></script>
    
    <script>
        function testBasicModal() {
            const modal = document.createElement('div');
            modal.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4';
            modal.innerHTML = `
                <div class="bg-white rounded-lg p-8 max-w-md w-full">
                    <h2 class="text-xl font-bold mb-4">Basic Test Modal</h2>
                    <p class="mb-4">This is a basic modal to test if modals work at all.</p>
                    <button onclick="this.closest('.fixed').remove()" class="bg-red-500 text-white px-4 py-2 rounded">Close</button>
                </div>
            `;
            document.body.appendChild(modal);
            log('✅ Basic modal created');
        }
        
        function testShowLoginModal() {
            try {
                log('🧪 Testing showLoginModal...');
                log('Function type: ' + typeof showLoginModal);
                
                if (typeof showLoginModal === 'function') {
                    showLoginModal();
                    log('✅ showLoginModal() called successfully');
                    
                    // Check if modal was actually created
                    setTimeout(() => {
                        const modals = document.querySelectorAll('.fixed.inset-0');
                        log('📊 Found ' + modals.length + ' modal(s) on page');
                        
                        if (modals.length > 0) {
                            const modal = modals[modals.length - 1]; // Get the last one
                            log('📄 Modal HTML length: ' + modal.innerHTML.length);
                            log('📄 Modal first 100 chars: ' + modal.innerHTML.substring(0, 100));
                            
                            if (modal.innerHTML.length === 0) {
                                log('❌ Modal content is empty!');
                                
                                // Test createModal directly
                                log('🔧 Testing createModal directly...');
                                if (typeof createModal === 'function') {
                                    const testModal = createModal('login');
                                    log('📄 Direct createModal result: ' + testModal.innerHTML.substring(0, 100));
                                } else {
                                    log('❌ createModal function not found');
                                }
                            }
                        }
                    }, 100);
                } else {
                    log('❌ showLoginModal is not a function');
                }
            } catch (error) {
                log('❌ Error calling showLoginModal: ' + error.message);
                console.error('Full error:', error);
            }
        }
        
        function testShowRegisterModal() {
            try {
                log('🧪 Testing showRegisterModal...');
                log('Function type: ' + typeof showRegisterModal);
                
                if (typeof showRegisterModal === 'function') {
                    showRegisterModal();
                    log('✅ showRegisterModal() called successfully');
                } else {
                    log('❌ showRegisterModal is not a function');
                }
            } catch (error) {
                log('❌ Error calling showRegisterModal: ' + error.message);
                console.error('Full error:', error);
            }
        }
        
        function testCreateModal() {
            try {
                log('🧪 Testing createModal directly...');
                log('createModal type: ' + typeof createModal);
                log('createLoginModal type: ' + typeof createLoginModal);
                
                if (typeof createLoginModal === 'function') {
                    log('📄 Testing createLoginModal string...');
                    const loginHtml = createLoginModal();
                    log('📄 Login HTML length: ' + loginHtml.length);
                    log('📄 Login HTML preview: ' + loginHtml.substring(0, 150) + '...');
                    
                    if (loginHtml && loginHtml.length > 0) {
                        log('✅ createLoginModal returns content');
                        
                        if (typeof createModal === 'function') {
                            log('📄 Testing createModal...');
                            const modal = createModal('login');
                            log('📄 Modal element type: ' + modal.tagName);
                            log('📄 Modal classes: ' + modal.className);
                            log('📄 Modal content length: ' + modal.innerHTML.length);
                            
                            if (modal.innerHTML.length > 0) {
                                document.body.appendChild(modal);
                                log('✅ Modal added to page successfully');
                            } else {
                                log('❌ Modal has no content after creation');
                            }
                        } else {
                            log('❌ createModal is not a function');
                        }
                    } else {
                        log('❌ createLoginModal returns empty or undefined');
                    }
                } else {
                    log('❌ createLoginModal is not a function');
                }
            } catch (error) {
                log('❌ Error testing createModal: ' + error.message);
                console.error('Full error:', error);
            }
        }
        
        function debugUtils() {
            log('🔍 Debugging Utils object...');
            log('Utils object: ' + typeof Utils);
            
            if (typeof Utils === 'object') {
                log('Utils.createElement: ' + typeof Utils.createElement);
                log('Utils.$: ' + typeof Utils.$);
                log('Utils.$$: ' + typeof Utils.$$);
                
                // Test createElement
                try {
                    const testEl = Utils.createElement('div', 'test-class', 'Test content');
                    log('✅ Utils.createElement works: ' + testEl.tagName);
                } catch (error) {
                    log('❌ Utils.createElement error: ' + error.message);
                }
            } else {
                log('❌ Utils object not found');
            }
        }
        
        function log(message) {
            const results = document.getElementById('results');
            results.innerHTML += '<div class="mb-1">' + message + '</div>';
            console.log(message);
        }
        
        // Test raw HTML content generation
        function testRawHTML() {
            try {
                const htmlDisplay = document.getElementById('htmlDisplay');
                document.getElementById('htmlContent').classList.remove('hidden');
                
                if (typeof createLoginModal === 'function') {
                    const loginHTML = createLoginModal();
                    log('✅ Got raw login HTML, length: ' + loginHTML.length);
                    htmlDisplay.textContent = loginHTML;
                } else {
                    log('❌ createLoginModal is not a function');
                    htmlDisplay.textContent = 'Function not available';
                }
            } catch (error) {
                log('❌ Error in testRawHTML: ' + error.message);
                console.error('Full error:', error);
            }
        }
        
        // Test direct HTML injection
        function testDirectInject() {
            try {
                log('🧪 Testing direct HTML injection...');
                
                // Create a container div
                const container = document.createElement('div');
                container.className = 'fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4';
                
                // Create a basic login form directly
                container.innerHTML = `
                    <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-8 relative">
                        <button class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl">
                            <i class="fas fa-times"></i>
                        </button>
                        
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold text-gray-900 mb-2">Direct Injection Test</h2>
                            <p class="text-gray-600">This form was created directly</p>
                        </div>
                        
                        <form class="space-y-6">
                            <div class="form-group">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                                <input type="email" name="email" required 
                                       class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                            </div>
                            
                            <div class="form-group">
                                <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                                <div class="relative">
                                    <input type="password" name="password" required 
                                           class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                </div>
                            </div>
                            
                            <button type="submit" 
                                    class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg font-semibold">
                                Sign In
                            </button>
                        </form>
                    </div>
                `;
                
                document.body.appendChild(container);
                log('✅ Direct HTML injection successful');
            } catch (error) {
                log('❌ Error with direct injection: ' + error.message);
                console.error('Full error:', error);
            }
        }
        
        // Test all functions on load
        document.addEventListener('DOMContentLoaded', function() {
            log('🚀 Page loaded, testing functions...');
            log('showLoginModal: ' + typeof showLoginModal);
            log('showRegisterModal: ' + typeof showRegisterModal);
            log('closeModal: ' + typeof closeModal);
            log('createModal: ' + typeof createModal);
            log('createLoginModal: ' + typeof createLoginModal);
            log('Utils: ' + typeof Utils);
        });
    </script>
</body>
</html>
