# Supervisor configuration for Opportuni MVP
# Save this as /etc/supervisor/conf.d/opportuni.conf

[program:opportuni]
command=/home/opportuni/opportuni/venv/bin/gunicorn --workers 3 --bind 127.0.0.1:8000 --timeout 120 --max-requests 1000 --max-requests-jitter 100 opportuni.wsgi:application
directory=/home/opportuni/opportuni/opportuni_backend
user=opportuni
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/opportuni/gunicorn.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=DJANGO_SETTINGS_MODULE="opportuni.settings.production"

[program:opportuni_celery]
command=/home/opportuni/opportuni/venv/bin/celery -A opportuni worker -l info
directory=/home/opportuni/opportuni/opportuni_backend
user=opportuni
autostart=false
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/opportuni/celery.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
environment=DJANGO_SETTINGS_MODULE="opportuni.settings.production"

# Note: Enable celery only if you're using background tasks
