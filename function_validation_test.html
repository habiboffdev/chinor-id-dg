<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Validation Test</title>
    <script src="opportuni_frontend/assets/js/utils.js"></script>
    <script src="opportuni_frontend/assets/js/auth.js"></script>
    <script src="opportuni_frontend/assets/js/api.js"></script>
</head>
<body>
    <div id="test-results"></div>
    
    <script src="opportuni_frontend/assets/js/opportunities.js"></script>
    <script>
        // Test all the functions that were causing ReferenceErrors
        function runFunctionTests() {
            const results = [];
            const testFunctions = [
                'updateResultsCount',
                'handleFilterError', 
                'applyQuickFilter',
                'clearAllFilters',
                'removeFilter',
                'addSkill',
                'removeSkill',
                'updateActiveFilters',
                'updateFiltersUI',
                'displayEmptyState',
                'initializeEnhancements'
            ];
            
            testFunctions.forEach(funcName => {
                try {
                    if (typeof window[funcName] === 'function') {
                        results.push(`✅ ${funcName} - Available`);
                    } else {
                        results.push(`❌ ${funcName} - Not available or not a function`);
                    }
                } catch (error) {
                    results.push(`❌ ${funcName} - Error: ${error.message}`);
                }
            });
            
            // Test basic function calls (non-destructive)
            try {
                updateResultsCount(5);
                results.push(`✅ updateResultsCount(5) - Called successfully`);
            } catch (error) {
                results.push(`❌ updateResultsCount(5) - Error: ${error.message}`);
            }
            
            try {
                handleFilterError(new Error('test'), 'test');
                results.push(`✅ handleFilterError() - Called successfully`);
            } catch (error) {
                results.push(`❌ handleFilterError() - Error: ${error.message}`);
            }
            
            document.getElementById('test-results').innerHTML = `
                <h2>Function Validation Results</h2>
                <pre>${results.join('\\n')}</pre>
            `;
        }
        
        // Run tests after page loads
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(runFunctionTests, 1000);
        });
    </script>
</body>
</html>
