name: Deploy Opportuni Backend

on:
  push:
    branches:
      - main
    paths:
      - 'opportuni_backend/**'
      - '.github/workflows/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy backend to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            echo "🚀 Starting backend deployment..."
            
            # Navigate to project directory
            cd /home/chinor-id-dg/chinor_id_new
            
            # Pull latest changes
            echo "📥 Pulling latest code..."
            git fetch origin
            git reset --hard origin/main
            git pull origin main
            
            # Activate virtual environment
            echo "🔧 Setting up Python environment..."
            source venv/bin/activate
            
            # Install/update Python dependencies
            echo "📦 Installing Python dependencies..."
            pip install -r opportuni_backend/requirements.txt
            
            # Navigate to Django project
            cd opportuni_backend
            
            # Run migrations
            echo "🗄️ Running database migrations..."
            python manage.py migrate --noinput
            
            # Collect static files (Django admin, DRF browsable API)
            echo "📁 Collecting static files..."
            python manage.py collectstatic --noinput
            
            # Generate updated API schema
            echo "📋 Generating API schema..."
            python manage.py spectacular --file api_schema_final.json --api-version openapi-json || echo "⚠️ Schema generation skipped"
            
            # Test Nginx configuration
            echo "🔍 Testing Nginx configuration..."
            sudo nginx -t
            
            # Restart backend services
            echo "🔄 Restarting Gunicorn/Django services..."
            sudo supervisorctl restart opportuni
            
            # Reload Nginx to pick up any config changes
            echo "🔄 Reloading Nginx..."
            sudo systemctl reload nginx
            
            # Check service status
            echo "✅ Checking service status..."
            sudo supervisorctl status opportuni
            
            # Health check
            echo "🏥 Running health check..."
            curl -f http://localhost:8001/api/auth/telegram-config/ || echo "⚠️ Health check failed"
            
            echo "🎉 Backend deployment completed successfully!"
            echo "📝 Note: React frontend is deployed separately"
