<!DOCTYPE html>
<html>
<head>
    <title>Filter Test</title>
</head>
<body>
    <h1>Simple Filter Test</h1>
    
    <select name="opportunity_type" class="opportunity-filter">
        <option value="">All Types</option>
        <option value="volunteer">Volunteer</option>
        <option value="internship">Internship</option>
    </select>
    
    <div id="result">No filter selected</div>
    
    <script src="opportuni_frontend/assets/js/utils.js"></script>
    <script>
        console.log('Simple test loaded');
        
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM ready');
            
            const select = document.querySelector('.opportunity-filter');
            console.log('Found filter:', select);
            
            if (select) {
                select.addEventListener('change', (e) => {
                    console.log('Filter changed to:', e.target.value);
                    document.getElementById('result').textContent = 'Selected: ' + e.target.value;
                });
            }
        });
    </script>
</body>
</html>
